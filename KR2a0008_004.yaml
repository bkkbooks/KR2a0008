body:
  text: 班馬異同卷四宋倪思編曹參世家第二十四史記五十四漢書同蕭何傳平陽侯曹參者沛人也秦時為沛獄掾而蕭何為主吏居縣為豪吏矣髙祖為沛公而初起也參以中㳙從將擊胡陵方與攻秦監公軍大破之東下薛擊泗水守軍薛郭西復攻胡陵取之徙守方與方與反為魏擊之豐反為魏攻之賜爵七大夫北擊秦司馬􅊂欣軍碭東破之取碭狐父祁善置又攻下邑以西至虞擊秦將章邯車騎攻爰轅戚及亢父先登遷為五大夫北救東阿擊章邯軍陷陳追至濮陽攻定陶取臨濟南救雍丘擊李由軍破之殺李由虜秦候一人秦將章邯破殺項梁也沛公與項羽引兵而東楚懷王以沛公為碭郡長將碭郡兵于是乃封參為執帛號曰建成君遷為戚公屬碭郡其後從攻東郡尉軍破之成武南擊王離軍成陽南復又攻之杠里大破之追北西至開封擊趙賁軍破之圍趙賁開封城中西擊秦將楊熊軍于曲遇破之虜秦司馬及御史各一人遷為執圭從西攻陽武下轘轅緱氏絶河津還擊趙賁軍尸北破之從南攻犨與南陽守齮戰陽城郭東陷陳取宛虜齮盡定南陽郡從西攻武關嶢關取之前攻秦軍藍田南又夜擊其北秦軍大破之遂至咸陽滅破秦項羽至以沛公為漢王漢王封參為建成侯從至漢中遷為將軍從還定三秦初攻下辨故道雍斄擊章平軍于好畤南破之圍好畤取壤鄉擊三秦軍壤東及髙櫟破之復圍章平章平出好畤走因擊趙賁內史保軍破之東取咸陽更命名曰新城參將兵守景陵二十三日三秦使章平等攻參參出擊大破之賜食邑于寧秦參以將軍引兵圍章邯于廢丘以中尉從漢王出臨晉關至河內下修武渡圍津東擊龍且項他定陶破之東取碭蕭彭城擊項籍軍漢軍大敗走參以中尉圍取雍丘王武反于外黃程處反于燕往擊盡破之柱天侯反于衍氏又進破取衍氏擊羽嬰于昆陽追至葉還攻武彊因至滎陽參自漢中為將軍中尉從擊諸侯及項羽王敗還至滎陽凡二嵗漢髙祖三二年拜為假左丞相入屯兵關中月餘魏王豹反以假左丞相别與韓信東攻魏將軍孫遫軍東張大破之因攻安邑得魏將王襄擊魏王于曲陽追至東武垣生得獲魏王豹取平陽得魏王豹母妻子盡定魏地凡五十二城縣賜食邑平陽因從韓信擊趙相國夏說軍于塢東大破之斬夏說韓信與故常山王張耳引兵下井陘擊成安君陳餘而令參還圍趙别將戚將軍公于塢城中戚將軍公出走追斬之乃引兵詣敖倉漢王之在所韓信已破趙為相國東擊齊參以右左丞相屬韓信焉攻破齊歷下軍遂取臨菑淄還定濟北郡攻收著漯隂平原鬲盧已而從韓信擊龍且軍于上假密大破之斬龍且虜其亞將軍周蘭定齊郡凡得七十餘縣得故齊王田廣相田光其守相許章及故齊膠東將軍田既韓信立為齊王引兵東詣陳與漢王共破項羽而參留平齊未服者項籍已死天下定漢王為即皇帝位韓信徙為楚王齊為郡參歸漢相印焉高帝祖以長子肥為齊王而以參為齊相國以髙祖六年賜爵列侯與諸侯剖符賜參爵列侯世世勿絶食邑平賜萬六百三十户世世勿絶號曰平陽侯除前所食邑參以齊相國擊陳豨將張春軍破之黥布反參以齊相國從悼惠王將兵車騎十二萬人與髙祖㑹擊黥布軍大破之南至蘄還定竹邑相蕭留參功凡下二國縣一百二十二得王二人相三人將軍六人大莫敖囂郡守司馬候御史各一人孝惠帝元年除諸侯相國法更以參為齊丞相參之相齊齊七十城天下初定悼惠王富于春秋參盡召長老諸先生問所以安集百姓如而齊故俗諸儒以百數言人人殊參未知所定聞膠西有蓋公善治黃老言使人厚幣請之既見蓋公蓋公為言治道貴清靜而民自定推此類具言之參于是避正堂舍蓋公焉其治要用黃老術故相齊九年齊國安集大稱賢相惠帝二年蕭何卒薨參聞之告舍人趣治行吾將且入相居無何使者果召參參去屬其後相曰以齊獄市為寄慎勿擾也後相曰治無大于此者乎參曰不然夫獄市者所以并容也今君擾之姦人安所容也乎吾是以先之參始參微時與蕭何善及為將宰相有郤隙至何且死所推賢唯參參代何為漢相國舉事無所變更一一遵蕭何之約束擇郡國吏木詘長大訥于文辭重謹厚長者即召除為丞相史吏之言文刻深欲務聲名者輒斥去之日夜飲醇酒卿大夫以下吏及賔客見參不事事來者皆欲有言至者參輒飲以醇酒間度之欲有所言復飲之酒醉而後去終莫得開說以為常相舍後園近吏舍吏舍日飲歌呼從吏惡患之無如之何乃請參逰後園中聞吏醉歌呼從吏幸相國召按之乃反取酒張坐飲亦大歌呼與相應和參見人之有細過専掩匿覆蓋之府中無事參子窋為中大夫惠帝怪相國不治事以為豈少朕與乃謂窋曰若女歸試私從容問而乃父曰高帝新棄羣臣帝富于春秋君為相國日飲無所請事何以憂天下乎然無言吾告若女也窋既洗沐歸時間侍自從其所諫參參怒而笞窋之二百曰趣入侍天下事非若乃所當言也至朝時惠帝讓參曰與窋胡治乎乃者我使諫君也參免冠謝曰陛下自察聖武孰與髙皇帝上曰朕乃安敢望先帝乎參曰陛下觀臣參䏻孰與蕭何賢上曰君似不及也參曰陛下言之是也且髙皇帝與蕭何定天下法令既眀具今陛下垂拱參等守職遵而勿失不亦可乎惠帝曰善君休矣參為漢相國出入三年卒薨諡曰懿侯子窋代侯百姓歌之曰蕭何為法顜講若畫一曹參代之守而勿失載其清淨靜民以寧一一平陽侯窋嗣侯髙后時為至御史大夫孝文帝立免為侯立二十九年卒諡為靜侯子竒代侯立七年卒諡為簡侯子時代侯時尚平陽公主生子襄時病癘歸國立二十三年卒諡夷侯𫝊國至曽孫子襄代侯武帝時為將軍擊胸奴襄尚衛長公主生子宗立十六年卒薨諡為共侯子宗代侯嗣征和二年中宗坐太子死有罪免為城旦國除至哀帝時乃封參𤣥孫之孫本始為平陽侯二千户王莽時薨子宏嗣建武中先降河北封平陽侯至今八侯太史公曰曹相國參攻城野戰之功所以能多若此者以與淮隂侯俱及信已滅而列侯成功唯獨參擅其名參為漢相國清靜極言合道然百姓離秦之酷後參與休息無為故天下俱稱其美矣贊曰蕭何曹參皆起秦刀筆吏當時録録未有竒節漢興依日月之末光何以信謹守管籥參與韓信俱征伐天下既定因民之疾秦法順流與之更始二人同心遂安海內淮隂黥布等已滅唯何參擅功名位冠羣臣聲施後世為一代之宗臣慶流苖裔盛矣哉班馬異同卷四
