body:
  text: 班馬異同卷三十宋倪思編酷吏列𫝊第六十二史記一百二十二張湯𫝊第二十九漢書五十九杜周𫝊第三十漢書六十張杜二𫝊漢書别見不入酷吏孔子曰道之以政齊之以刑民免而無恥導之以德齊之以禮有恥且格老氏稱上德不德是以有德下德不失德是以無德法令滋章盜賊多有太史公曰信哉是言也法令者治之具而非制治清濁之源原也昔天下之網罔嘗密矣然姦僞萌軌愈起其極也上下相遁至于不振當是之時吏治若救火揚沸非武健嚴酷惡能勝其任而愈偷快乎言道德者溺其於職矣故曰聽訟吾猶人也必也使無訟乎下士聞道大笑之非虛言也漢興破觚而為圜斫雕雕而為朴朴號為網罔漏于吞舟之魚而吏治蒸蒸䒱䒱不至于姦黎民艾安由是觀之在彼不在此髙后時酷吏獨有侯封刻轢宗室侵辱功臣吕氏已敗遂禽夷侯封之家孝景時鼂錯以刻深頗用術輔其資而七國之亂發怒于錯錯卒以被戮其後有郅都寧成之屬倫郅都者河東大揚陽人也以郎事孝文帝孝景帝時都為中郎將敢直諌面折大臣于朝嘗從入上林賈姫如在厠野彘卒來入厠上目都都不行上欲自持兵救賈姬都伏上前曰亡一姬復一姬進天下所少寧賈姬等乎邪陛下縱自輕奈宗室太后何上還彘亦去不傷賈姬太后聞之賜都金百斤上亦賜金百斤由此重郅都濟南瞷氏宗人三百餘家豪猾二千石莫能制于是景帝乃拜都為濟南太守都至則族滅誅瞷氏首惡餘皆股栗居歲餘郡中不拾遺㫄十餘郡守畏都如大府都為人勇有氣力公廉不發私書問遺無所受請寄無所聽常自稱曰已倍背親而仕出身固當奉職死節官下終不顧妻子矣郅都遷為中尉丞相條侯至貴倨居也而都揖丞相是時民朴朴畏罪自重而都獨先嚴酷致行法不避貴戚列侯宗室見都側目而視號曰蒼鷹臨江王徴詣中尉府對簿臨江王欲得刀筆為書謝上而都禁吏不弗豫與魏其侯使人以間與豫臨江王臨江王既得為書謝上因自殺竇太后聞之怒以危法中都都免歸家孝景乃乃使使持節即拜都為鴈門太守而便道之官得以便宜從事胸奴素聞郅都節居舉邉為引兵去竟郅都死不近鴈門胸奴至為偶人象郅都令騎馳射莫能中其見憚如此胸奴患之竇太后乃竟中都以漢法景帝曰都忠臣欲釋之竇太后曰臨江王獨非忠臣邪乎於是遂斬郅都也寧􅑔成者南陽穰人也以郎謁者事景帝好氣為人小少吏必陵其長吏為人上操下急如束溼薪滑猾賊任威稍遷至濟南都尉而郅都為守始前數都尉皆步入府因吏謁守如縣令其畏郅都如此及成性直陵凌都出其上都素聞其聲于是善遇與結歡久之郅都死後長安左右宗室多暴犯法於是上召寧成為中尉其治效郅都其廉弗如然宗室豪桀人皆人人惴恐武帝即位徙為內史外戚多毀成之短抵罪髠鉗是時九卿罪死即死少被刑而成刑極刑自以為不復收於是乃解脫詐刻𫝊出關歸家稱曰仕不至二千石賈不至千萬安可比人乎乃乃貰貸貣買陂田千餘頃假貧民役使數千家數年㑹赦致産數千萬金為任俠持吏長短出從數十騎其使民威重于郡守周陽由者其父趙兼以淮南王舅父侯周陽故因姓周陽氏焉由以宗家任為郎事孝文及景帝景帝時由為郡守武帝即位吏治尚循修謹甚然由居二千石中最為暴酷驕恣所愛者撓法活之所憎者曲法誅滅之所居郡必夷其豪為守視都尉如令為都尉必陵太守奪之治與汲黯俱為忮司馬安之文惡俱在二千石列同車未嘗敢均茵伏馮由後由為河東都尉時與其守勝屠公爭權相告言罪勝屠公當扺罪義議不受刑自殺而由棄市自寧寧成周陽由之後事益多民巧法大扺吏之治類多成由等矣趙禹者斄人也以佐史補中都官用廉為令史事太尉周亞夫亞夫為丞相禹為丞相史府中皆稱其亷平然亞夫弗任曰極知禹無害然文深不可以居大府今上武帝時禹以刀筆吏積勞稍遷為御史上以為能至太中大夫與張湯論定諸律令作見知吏𫝊得相監司用以法益刻蓋盡自此始連下張湯𫝊內禹為人廉至官屬隂罪又連後嘗中廢至以壽卒于家結𫝊張湯者杜陵人也其父為長安丞出湯為兒守舍還而鼠盜肉其父怒笞湯湯掘窟熏得盜鼠及餘肉劾鼠掠治𫝊爰書訊鞫論報并取鼠與肉具獄磔堂下其父見之視其文辭如老獄吏大驚遂使書獄父死後湯為長安吏久之周陽侯始為諸卿時嘗繫長安湯傾身為事之及出為侯大與湯交遍見湯貴人湯給事內史為寧寧成掾以湯為無害言太府調為茂陵尉治方中武安侯為丞相徴湯為史時薦言之天子補侍御史使案事治陳皇后巫蠱獄深竟黨與於是上以為能稍遷至太中大夫與趙禹共定諸律令務在深文拘守職之吏已而趙禹遷為中尉徙為至少府而張湯為廷尉兩人交歡而兄事禹漢書連下禹志在奉公禹為人亷倨裾為吏以來舍毋無食客公卿相造請禹禹終不行報謝務在絶知友賔客之請孤立行一意而已見文法輒取亦不覆案求官屬隂罪自禹為人亷已下至此漢書入趙禹傳禹志在奉公孤立而湯為人多詐舞知以御人始為小吏乾沒與長安富賈田甲魚翁叔之屬交私及列九卿收接天下名士大夫已心內雖不合然陽浮慕道與之是時上方鄉文學湯决大獄欲傅古義乃請博士弟子治尚書春秋補廷尉史平亭疑法奏讞疑事必豫奏先為上分别其原上所是受而著讞决法廷尉潔挈令揚主之明奏事即譴湯應摧謝鄉上意所便必引正監掾史賢者曰固為臣議如此上責臣臣弗用愚抵于此罪常釋聞間即奏事上善之曰臣非知為此奏乃乃正監掾史某所為之其欲薦吏揚人之善蔽解人之過如此所治即上意所欲罪􅖄豫監史吏深禍刻者即上意所欲釋與豫監史吏輕平者所治即豪必舞文巧詆即下户羸弱時口言雖文致法上財裁察于是往往釋湯所言湯至于大吏內行修也交通賔客飲食于故人子弟為吏及貧昆弟調護之尤厚其造請諸公不避寒暑是以湯雖文深意忌不専平然得此聲譽而深刻深吏多為爪牙用者依于文學之士丞相𢎞數稱其美及治淮南衡山江都反獄皆窮根本嚴助及伍被上欲釋之湯爭曰伍被本畫造反謀而助親幸出入禁闥爪牙腹心之臣乃交私諸侯如此弗誅後不可治于是上可論之其治獄所巧排大臣自以為功多此類於繇是湯益尊任遷為御史大夫㑹渾邪等降漢大興兵伐胸奴山東水旱貧民流徙皆仰卬給縣官縣官空虛于是湯丞承上指請造白金及五銖錢籠天下鹽鐵排富商大賈出告緡令鉏豪彊并兼之家舞文巧詆以輔法湯每朝奏事語國家用日晏旰天子忘食丞相取充位天下事皆決于湯百姓不安其生騷動縣官所興未獲其利姦吏竝侵漁于是痛繩以罪罪則自公卿以下至于庶人咸指湯湯嘗病天子上至自至舍視病其隆貴如此胸奴來請求和親羣臣議上前博士狄山曰和親便上問其便山曰兵者凶器未易數動髙帝欲伐丐奴大困平城乃遂結和親孝惠髙后時天下安樂及孝文帝欲事胸奴北邉蕭然苦兵矣孝景時吳楚七國反景帝往來兩東宫間天下寒心者數月吳楚已破竟景帝不言兵天下富貴今自陛下舉興兵擊胸奴中國以空虛邉民大困貧由此是觀之不如和親上問湯湯曰此愚儒無知狄山曰臣固愚忠若御史大夫湯乃詐忠若湯之治淮南江都以深文痛詆諸侯别疏骨肉使藩臣不自安臣固知湯之為詐忠于是上作色曰吾使生居一郡能無使虜入盜乎山曰不能曰居一縣對曰不能復曰居一障間山自度辨窮且下吏曰能于是上乃遣山乘障至月餘胸奴斬山頭而去自是以後羣臣震懾讋湯之客田甲雖賈人有賢操始湯為小吏時與錢通及湯為大吏而甲所以責湯行義過失亦有烈士之風湯為御史大夫七歲敗河東人李文故嘗與湯有卻隙已而為御史中丞恚薦數從中文書事有可以傷湯者不能為地湯有所愛史魯謁居知湯不弗平使人上蜚飛變告文姦事事下湯湯治論殺文而湯心知謁居為之上問曰言變事蹤跡從迹安起湯詳陽驚曰此殆文故人怨之謁居病卧閭里主人湯自往視疾病為謁居摩足趙國以冶鑄為業王數訟鐵官事湯常排趙王趙王求湯隂事謁居嘗案趙王趙王怨之并上書告湯大臣也史謁居有病湯至為摩足疑與為大姦事下廷尉謁居病死事連其弟弟繫導官湯亦治他囚導官見謁居弟欲隂為之而詳陽不省謁居弟弗不知而怨湯使人上書告湯與謁居謀共變告李文事下減宣宣嘗與湯有郤隙及得此事窮竟其事未奏也㑹人有盜發孝文園瘞錢丞相青翟朝與湯約俱謝至前湯念獨丞相以四時行園當謝湯無與也不謝丞相謝上使御史案其事湯欲致其文丞相見知丞相患之三長史皆害湯欲陷之始長史朱買臣㑹稽人也讀春秋莊助使人言買臣買臣以楚辭與助俱幸侍中為太中大夫用事而湯乃為小吏跪伏使買臣等前已而湯為廷尉治淮南獄排擠莊助買臣固心望及湯為御史大夫買臣以㑹稽守為主爵都尉列于九卿數年坐法廢守長史見湯湯坐牀上丞史遇買臣弗為禮買臣楚士深怨常欲死之素怨湯語在其𫝊王朝齊人也以術至右內史邉通學長短剛暴彊人也官再至濟南相故皆居湯右已而失官守長史詘體于湯湯數行丞相事知此三長史素貴常陵折之以故三長史合謀曰始湯約與君謝已而賣君今欲劾君以宗廟事此欲代君耳吾知湯隂事使吏捕案湯左田信等曰湯且欲奏為請奏信輒先知之居物致富與湯分之及他姦事事辭頗聞上問湯曰吾所為賈人輒先知之益居其物是類有以吾謀告之者湯不謝湯又詳陽驚曰固宜有減宣亦奏謁居等事天子上果以湯懷詐面欺使使八輩簿責湯湯具自道無此不服于是上使趙禹責湯禹至讓湯曰君何不知分也君所治夷滅者幾何人矣今人言君皆有狀天子重致君獄欲令君自為計何多以對簿為湯乃乃為書謝曰湯無寸尺之功起刀筆吏陛下幸致為位三公無以塞責然謀陷湯罪者三長史也遂自殺湯死家産直不過五百金皆所得奉賜無他業贏昆弟諸子欲厚葬湯湯母曰湯為天子大臣被汙惡言而死何厚葬乎為載以牛車有棺而無椁天子上聞之曰非此母不能生此子乃書案誅三長史丞相青翟自殺出田信上惜湯復稍遷進其子安世漢書湯𫝊止此下文接前官屬隂罪至末入趙禹𫝊趙禹嘗中廢已而為廷尉始條侯以為禹賊深弗任及禹為少府比九卿禹酷急至晚節事益多吏務為嚴峻而禹治加緩而名為平王溫舒等後起治峻酷於禹禹以老徙為燕相數歲悖亂悖有罪免歸後湯十餘年以壽卒于家漢書趙禹𫝊後即接義縱義縱者河東人也為少年時嘗常與張次公俱攻剽為羣盜縱有姊姁以醫幸王太后王太后問有子兄弟為官者乎姊曰有弟無行不可太后乃乃告上上拜義姁弟縱為中郎補上黨郡中令治敢行往少藴溫藉縣無逋事舉為第一遷為長陵及長安令直法行治不避貴戚以捕案太后外孫修成君子仲中上以為能遷為河內都尉至則族滅其豪穰氏之屬河內道不拾遺而張次公亦為郎以勇悍從軍敢深入有功封為岸頭侯寧寧成家居上欲以為郡守御史大夫𢎞曰臣居山東為小吏時寧寧成為濟南都尉其治如狼牧羊成不可使令治民上乃拜成為關都尉歲餘關東吏稅肄𨽻郡國出入關者號曰寧見乳虎無值直寧寧成之怒其暴如此義縱自河內遷為南陽太守聞寧寧成家居南陽及縱至關寧寧成側行送迎然縱氣盛弗為禮至郡遂案按寧寧氏盡破碎其家成坐有罪及孔暴之屬皆奔奔亡南陽吏民重足一迹而平氏朱彊杜衍杜周為縱爪牙之吏任用遷為廷尉史軍數出定襄定襄吏民亂敗于是徙縱為定襄太守縱至掩定襄獄中重罪輕繫二百餘人及賔客昆弟私入相視者亦二百餘人縱一一切捕鞫曰為死罪解脫是日皆報殺四百餘人其後郡中不寒而栗猾民佐吏為治是時趙禹張湯以深刻為九卿矣然其治尚寬輔法而行而縱以鷹擊毛摰為治後㑹更五銖錢白金起民為姦京師尤甚乃乃以縱為右內史王溫舒為中尉溫舒至惡其所為不弗先言縱縱必以氣凌陵之敗壞其功其治所誅殺甚多然取為小治姦益不勝直指始出矣吏之治以斬殺縛束為務閻奉以惡用矣縱亷其治放效郅都上幸鼎湖病久已而卒起幸甘泉道多不治上怒曰縱以我為不復行此道乎嗛銜之至冬楊可方受告緍縱以為此亂民部吏捕其為可使者天子聞使杜式治以為廢格沮事棄縱市後一歲張湯亦死王溫舒者陽陵人也少時椎埋為姦已而試補縣亭長數廢數為吏以治獄至廷尉史事張湯遷為御史督盜賊殺傷甚多稍遷至廣平都尉擇郡中豪敢任往吏十餘人以為爪牙皆把其隂重罪而縱使督盜賊快其意所欲得此人雖有百罪弗法即有避回因其事夷之亦滅宗以其故齊趙之郊盜賊不敢近廣平廣平聲為道不拾遺上聞遷為河內太守素居廣平時皆知河內豪姦之家及往以九月而至令郡具私馬五十匹為驛自河內至長安部吏如居廣平時方略捕郡中豪猾郡中豪猾相連坐千餘家上書請大者至族小者乃死家盡沒入償臧奏行不過二三日得可事論報至流血十餘里河內皆怪其奏以為神速盡十二月郡中母聲毋敢夜行野無犬吠之盜其頗不得失之旁郡國梨來追求㑹春溫舒頓足歎曰嗟乎令冬月益展一月足吾事矣其好殺伐行威不愛人如此天子上聞之以為能遷為中尉其治復放河內徙諸名徒請召猜禍猾吏與從事河內則楊皆麻戊關中楊贛成信等義縱為內史憚之未敢恣治及縱死張湯敗後徙為廷尉而尹齊為中尉坐法抵罪連下楊僕傅內溫舒復為中尉尹齊者東郡茌平人也以刀筆吏稍遷至御史事張湯張湯數稱以為亷武帝使督盜賊所斬伐不避貴戚藝遷為關內都尉聲甚于寧寧成上以為能遷拜為中尉吏民益凋雕敝輕尹齊木強少文豪惡吏伏匿而善吏不能為治以故事多廢抵罪上復徙溫舒為中尉後復為淮陽都尉王溫舒敗連下楊僕𫝊內後數年病死而楊僕以嚴酷為主爵都尉楊僕者宜陽人也以千夫為吏河南守案舉以為能遷為御史使督盜賊關東治放尹齊以為敢摰擊行稍遷至主爵都尉列九卿天子上以為能南越反拜為樓船將軍有功封將梁侯東越反上欲復使將為其伐前勞以書勑責之曰將軍之功獨有先破石門尋狹非有斬將騫旗之實也烏足以驕人哉前破番禺捕降者以為虜掘死人以為獲是一過也建德呂嘉逆罪不容於天下將軍擁精兵不窮追超然以東越為援是二過也士卒暴露連歲為朝㑹不置酒將軍不念其勤勞而造佞巧請乘𫝊行塞因用歸家懷銀黃垂三組夸鄉里是三過也失期內顧以道惡為解失尊尊之叙是四過也欲請蜀刀問君賈幾何對曰率數百武庫日出兵而陽不知挾僞干君是五過也受詔不至蘭池宫明日又不對假令將軍之吏問之不對令之不從其罪何如推此心以在外江海之間可得信乎令東越深入將軍能率衆以掩過不僕惶恐對曰願盡死贖罪與王溫舒俱破東越後復與左將軍荀彘俱擊朝鮮為荀彘所縳語在朝鮮𫝊還免為庶人居久之病死漢書楊僕𫝊止此下起咸宣𫝊而溫舒復為中尉為人少文居廷它惛惛不辨至於中尉則心開督盜賊素習關中俗知豪惡吏豪惡吏盡復為用為方略吏苛察盜賊淫惡少年投缿購告言姦置伯格落長以牧收司姦盜賊溫舒為人多讇善事有勢藝者即無勢藝者視之如奴有勢藝家雖有姦如山弗犯無勢藝者雖貴戚必侵辱舞文巧詆請下户之猾以焄動大豪其治中尉如此姦猾窮治大抵氐盡靡爛獄中行論無出者其爪牙吏虎而冠于是中尉部中中猾以下皆伏有勢藝者為遊聲譽稱治治數歲其吏多以權貴冨溫舒擊東越還議有不中意者坐以小法抵罪免是時天子上方欲作通天臺而未有人溫舒請覆中尉脫卒得數萬人作上說拜為少府徙為右內史治如其故姦邪少禁坐法失官復為右輔行中尉事如故操歲餘㑹宛軍發詔徴豪吏溫舒匿其吏華成及人有變告溫舒受員騎錢他姦利事罪至族自殺其時兩弟及兩婚家亦各自坐他罪而族光祿勳徐自為曰悲夫夫古有三族而王溫舒罪至同時而五族乎溫舒死家直纍絫千金漢書上溫舒𫝊止此下起尹齊𫝊後數歲年尹齊亦以淮陽都尉病死家直不滿五十金所誅滅淮陽甚多及死仇家欲燒其尸口妻亡去歸葬漢書此段結上文尹齊𫝊後下起楊僕傳自溫舒等以惡為治而是時郡守都尉諸侯相二千石欲為治者其治大抵盡放效王溫舒等而吏民益輕犯法盜賊滋起南陽有梅免白百政楚有殷段中杜少齊有徐勃燕趙之間有堅盧范生主之屬大羣至數千人擅自號攻城邑取庫兵釋死罪縛辱郡太守都尉殺二千石為檄告縣趣趨具食小羣盜以百數掠鹵鄉里者不可勝稱數也于是天子上始使御史中丞丞相長史使督之猶弗能禁也乃使光祿大夫范昆諸輔部都尉及故九卿張德等衣繡衣持節虎符發兵以興擊斬首大部或至萬餘級及以法誅通行飲食坐相連諸郡甚者數千人數歲乃乃頗得其渠率散卒失亡復聚黨阻山川者往往而羣居無可奈何于是作沈命法曰羣盜起不發覺發覺而弗捕弗滿品者二千石以下至小吏主者皆死其後小吏畏誅雖有盜不弗敢發恐不能得坐課纍府府亦使其不言故盜賊寖多上下相為匿以文辭避文法焉漢書自是時郡守尉諸侯相以下入咸宣𫝊後减宣者楊人也以佐史無害給事河東守府衛將軍青使買馬河東見宣無害言上徴為大廄丞官事辦稍遷至御史及中丞使治主父偃及治淮南反獄所以微文深詆殺者甚衆稱為敢决疑數廢數起為御史及中丞者幾二十歲王溫舒免為中尉而宣為左內史其治米鹽事大小皆關其手自部署縣名曹實寶物官吏令丞不弗得擅搖痛以重法繩之居官數年一一切郡中為小治辦辨然獨宣以小致至大能因力自行之難以為經中廢為右扶風坐怨怒其吏成信信亡藏臧上林中宣使郿令將吏卒䦨入上林中𧖟室門攻亭格殺信吏卒格信時射中上林苑門宣一下吏詆罪以為大逆當族自殺而杜周任用連上文楊僕𫝊內是時郡守尉諸侯相二千石杜周者南陽杜衍人也義縱為南陽太守以周為爪牙舉薦之張湯為廷尉史事張湯湯數言其無害至御史使案邉失亡所論殺甚衆多奏事中上意任用與減宣相編更為中丞者十餘歲其治與宣相放然周少言重遲外寬而內深次骨宣為左內史周為廷尉其治大抵放張湯而善候伺司上所欲擠者因而陷之上所欲釋者久繫待問而微見其冤狀客有讓謂周曰君為天下下决平不循三尺法専以人主意指為獄獄者固如是乎周曰三尺安出哉前主所是著為律後主所是疏為令當時為是何古之法乎至周為廷尉詔獄亦益多矣二千石繫者新故相因不减百餘人郡吏大太府舉之廷尉一歲至千餘章章大者連逮證案數百小者數十人逺者數千里近者數百里㑹獄吏因責如章告劾不服以笞掠笞定之于是聞有逮證皆亡匿獄久者至更數赦十有餘歲而相告言大抵氐盡詆以不道以上廷尉及中都官詔獄逮至六七萬人吏所增加十有餘萬餘人周中廢後為執金吾逐盜捕治桑𢎞羊衛皇后昆弟子刻深天子上以為盡力無私遷為御史大夫家兩子夾河為守其治暴酷皆甚于王溫舒等矣始杜周初微為廷史有一馬且不全及身久任事至列三公列而子孫尊官兩子夾河為郡守訾纍數巨萬矣治皆酷暴唯少子延年行寬厚云太史公贊曰自郅都以下杜周十人者此皆以酷烈為聲然郅都伉抗直引是非爭天下大體張湯以知隂陽阿邑人主與俱上下時數辨當否國家賴其便趙禹時據据法守正杜周從諛以少言為重自張湯死後網罔密多詆嚴官事叢寖以耗廢九卿碌碌奉其官職救過不瞻給何暇論繩墨之外乎自是以至哀平酷吏衆多然莫足數此其知名見紀者也然此十人中其亷者足以為儀表其汚者足以為戒方略教導道一切禁姦止邪一切亦皆彬彬質有其文武焉雖慘酷斯稱其位矣湯周子孫貴盛故别𫝊至若蜀守馮當暴挫廣漢李貞擅磔人東郡彌僕鋸項天水駱璧推减河東褚廣妄殺京兆無忌馮翊殷周蝮鷙水衡閻奉撲擊賣請何足數哉何足數哉班馬異同卷三十
