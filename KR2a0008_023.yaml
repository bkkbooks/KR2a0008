body:
  text: 班馬異同卷二十三宋倪思編胸奴列傳第五十史記一百十胸奴傳上第六十四漢書九十四胸奴其先祖夏后氏之苗裔也曰淳維唐虞以上有山戎獫狁允葷薰粥居於北蠻邉隨草畜牧而轉移其畜之所多則馬牛羊其竒畜則橐駝他驢騾駃騠騊駼驒騱奚逐水草遷徙毋無城郭常處居耕田之業然亦各有分地毋無文書以言語為約束兒能騎羊引弓射鳥鼠少長則射狐兔用為肉食士力能彎弓盡為甲騎其俗寬則隨畜因射田獵禽獸為生業急則人習戰攻以侵伐其天性也其長兵則弓矢短兵則刀鋋利則進不利則退不羞遁走茍利所在不知禮義自君王以下咸食畜肉衣其皮革被旃裘壯者食肥美老者飲食其餘貴壯健賤老弱父死妻其後母兄弟死者皆取其妻妻之其俗有名不諱而無姓字夏道衰而公劉失其稷官變於西戎邑于豳其後三百有餘嵗戎狄攻大王亶父亶父亡走于岐下而豳人悉從亶父而邑焉作周其後百有餘嵗周西伯昌伐畎夷氏後十有餘年武王伐紂而營雒邑復居于酆鄗鎬放逐戎夷涇洛之北以時入貢命名曰荒服其後二百有餘年周道衰而周穆王伐犬畎戎得四白狼四白鹿以歸自是之後荒服不至於是周遂作甫吕刑之辟至穆王之後孫懿王時王室遂衰戎狄交侵暴虐中國中國被其苦詩人始作疾而歌之曰靡室靡家獫允之故豈不日戒獫允孔棘至懿王曽孫宣王興師命將以征伐之詩人美大其功曰薄伐獫允至于大原出車彭彭城彼朔方是時四夷賓服稱為中興二百有餘年至于周幽王用寵姬褒姒之故與申侯有郤申侯怒而與犬畎戎共攻殺周幽王于驪麗山之下遂取周之焦穫地鹵獲而居于涇渭之間侵暴中國秦襄公救周於是周平王去酆鄗鎬而東徙于雒邑當是之時秦襄公伐戎至岐􅑢始列為諸侯是後六十有五年而山戎越燕而伐齊齊釐公與戰于齊郊其後四十四年而山戎伐燕燕告急于齊齊桓公北伐山戎山戎走其後二十有餘年而戎狄翟至洛邑伐周襄王襄王出奔于鄭之汜邑初周襄王欲伐鄭故取戎狄翟女為后與戎狄翟兵共伐鄭已而黜狄翟后狄翟后怒而襄王後繼母曰惠后有子子帶欲立之於是惠后與狄翟后子帶為內應開戎狄翟戎狄翟以故得入破逐周襄王而立子帶為天子王於是戎狄翟或居于陸渾東至於衛侵盜尤甚暴虐中國中國疾之故詩人歌之曰戎狄是膺薄伐獫狁至於太原出輿彭彭城彼朔方周襄王既居外四年乃乃使使告急于於普晉文公初立欲修霸業乃興師伐逐戎翟誅子帶迎內周襄王居于雒邑當是之時秦普為强國普文公攘戎翟居于河西圁圜洛之間號曰赤翟白翟而秦穆公得由余西戎八國服於秦故自隴以西有綿諸緄畎戎翟䝠之戎在岐梁山涇漆之北有義渠大荔烏氏朐衍之戎而晉北有林胡樓煩之戎燕北有東胡山戎各分散居溪谷自有君長往往而聚者百有餘戎然莫能相一一自是之後百有餘年晉悼公使魏絳和戎翟戎翟朝晉後百有餘年趙襄子踰句注而破之并代以臨胡貉其後既與韓魏共滅智知伯分普地而有之則趙有代句注之以北而魏有河西上郡以與戎界邉其後義渠之戎築城郭以自守而秦稍𧖟食之至於惠王遂拔義渠二十五城惠王擊伐魏魏盡入西河及上郡于秦秦昭王時義渠戎王與宣太后亂有二子宣太后詐而殺義渠戎王於甘泉遂起兵伐殘滅義渠於是秦有隴西北地上郡築長城以拒距胡而趙武靈王亦變俗胡服習騎射北破林胡樓煩築長城自代並隂山下至髙闕為塞而置雲中鴈門代郡其後燕有賢將秦開為質於胡胡甚信之歸而襲破走東胡東胡郤千餘里與荆軻刺秦王秦舞陽者開之孫也燕亦築長城自造陽至襄平置上谷漁陽右北平遼西遼東郡以拒距胡當是之時冠帶戰國七而三國邉於胸奴其後趙將李牧時胸奴不敢入趙邊後秦滅六國而始皇帝使蒙恬將數十萬之衆北擊胡悉收河南地因河為塞築四十四縣城臨河徙適戌以充之而通直道自九原至雲陽因邊山險塹溪谷可繕者治繕之起臨洮至遼東萬餘里又度河據陽山北假中當是之時東胡彊而月氏盛胸奴單于曰頭曼頭曼不勝秦北徙十有餘年而蒙恬死諸侯畔秦中國擾亂諸秦所徙適戍邊者皆復去於是胸奴得寬復稍度河南與中國界於故塞單于有太子名曰冒頓後有所愛閼氏生少子而單于頭曼欲廢冒頓而立少子乃乃使冒頓質於月氏冒頓既質於月氏而頭曼急擊月氏月氏欲殺冒頓冒頓盜其善馬騎之亡歸頭曼以為壯令將萬騎冒頓乃作為鳴鏑習勒其騎射令曰鳴鏑所射而不悉射者斬之行獵鳥獸有不射鳴鏑所射者輒斬之已而冒頓以鳴鏑自射其善馬左右或不莫敢射者冒頓立斬不射善馬者之居頃之復以鳴鏑自射其愛妻左右或頗恐不敢射冒頓又復斬之居頃之冒頓出獵以鳴鏑射單于善馬左右皆射之於是冒頓知其左右皆可用從其父單于頭曼獵以鳴鏑射頭曼其左右亦皆隨鳴鏑而射殺單于頭曼遂盡誅其後母與弟及大臣不聽從者於是冒頓自立為單于冒頓既立是時東胡彊盛聞冒頓殺父自立乃使使謂冒頓曰欲得頭曼時有號千里馬冒頓問羣臣羣臣皆曰千里馬此胸奴寶馬也勿與豫冒頓曰奈何與人鄰國而愛一馬乎遂與之千里馬居頃之東胡以為冒頓畏之乃使使謂冒頓曰欲得單于一閼氏冒頓復問左右左右皆怒曰東胡無道乃求閼氏請擊之冒頓曰奈何與人鄰國愛一女子乎遂取所愛閼氏與豫東胡東胡王愈益驕西侵與胸奴間中間有棄地莫居千餘里各居其邉為甌脫東胡使使謂冒頓曰胸奴所與我界甌脫外棄地胸奴非不能至也吾欲有之冒頓問羣臣羣臣或曰此棄地豫之亦可勿豫亦可於是冒頓大怒曰地者國之本也奈何豫之人諸言豫之者皆斬之冒頓上馬令國中有後者斬遂東襲擊東胡東胡初輕冒頓不為備及冒頓以兵至擊大破滅東胡王而虜其民人衆及畜産既歸西擊走月氏南并樓煩白羊河南王侵燕代悉復收秦所使蒙恬所奪胸奴地者與漢關故河南塞至朝那膚施遂侵燕代是時漢兵方與項羽相距中國罷於兵革以故冒頓得自彊控弦之士三十餘萬自淳維以至頭曼千有餘嵗時大時小别散分離尚矣其世傳不可得而次云然至冒頓而胸奴最彊大盡服從北夷而南與中國諸夏為敵國其世傳國姓官號乃可得而記云單于姓攣鞮氏其國稱之曰撑犁孤塗單于胸奴謂天為撑犁謂子為孤塗單于者廣大之貌也言其象天單于然也置左右賢王左右谷蠡王左右大將左右大都尉左右大當戶左右骨都侯胸奴謂賢曰屠耆故常以太子為左屠耆王自如左右賢王以下至當戶大者萬餘騎小者數千凡二十四長立號曰萬騎諸其大臣皆世官呼衍氏蘭氏其後有須卜氏此三姓其貴種也諸左方王將居東方直上谷以往者東接穢貉朝鮮右方王將居西方直上郡以西接月氏氐羌而單于之庭直代雲中各有分地逐水草移徙而左右賢王左右谷蠡王最為大國左右骨都侯輔政諸二十四長亦各自置千長百長什長裨小王相封都尉當戶且渠之屬嵗正月諸長小少㑹單于庭祠五月大㑹籠龍城祭其先天地鬼神秋馬肥大㑹蹛林課校人畜計其法拔刃尺者死坐盜者沒入其家有罪小者軋大者死獄久者不過滿十日一國之囚不過數人而單于朝出營拜日之始生夕拜月其坐長左而北鄉日上戊巳其送死有棺槨金銀衣裘裳而無封樹喪服近幸臣妾從死者多至數千十百人舉事而候星月常隨月盛壯則以攻戰月虧則退兵其攻戰斬首虜賜一巵酒而所得鹵獲因以豫之得人以為奴婢故其戰人人自為趣趨利善為誘兵以冒包敵故其見敵則逐利如鳥之集其困敗則瓦解雲散矣戰而扶輿輿死者盡得死者家財後北服渾庾窳屈射丁靈零鬲隔昆龍薪新犂䔣之國於是胸奴貴人大臣皆服以冒頓單于為賢是時漢初定中國徙韓王信於代都馬邑胸奴大攻圍馬邑韓王信降胸奴胸奴得信因引兵南踰句注攻太原至晉陽下髙帝自將兵往擊之㑹冬大寒雨雪卒之墮指者十二三於是冒頓詳陽敗走誘漢兵漢兵逐擊冒頓冒頓匿其精兵見其羸弱於是漢悉兵多步兵三十二萬北逐之髙帝先至平城步兵未盡到冒頓縱精兵四三十餘萬騎圍髙帝於白登七日漢兵中外不得相救餉胸奴騎其西方盡白馬東方盡青駹馬北方盡烏驪馬南方盡騂馬髙帝乃乃使使間厚遺閼氏閼氏乃乃謂冒頓曰兩主不相困今得漢地而單于終非能居之也且漢主主亦有神單于察之冒頓與韓王信之將王黃趙利期而黃利兵又久不來疑其與漢有謀亦取閼氏之言乃乃解開圍之一角於是髙皇帝令士皆持滿傅矢外鄉從解角直出竟得與大軍合而冒頓遂引兵而去漢亦引兵而罷使劉敬結和親之約是後韓王信為胸奴將及趙利王黃等數倍背約侵盜代鴈門雲中居無幾何陳豨反又與韓信合謀擊代漢使樊噲往擊之復拔收代鴈門雲中郡縣不出塞是時胸奴以漢將數率衆往降故冒頓常往來侵盜代地於是漢髙祖患之髙帝乃使劉敬奉宗室女公翁主為單于閼氏嵗奉胸奴絮繒酒米食物各有數約為昆兄弟以和親冒頓乃乃少止後燕王盧綰復反率其黨數千且萬人降胸奴往來苦上谷以東終髙祖崩世孝惠吕髙太后時漢初定故胸奴冒頓寖以驕冒頓乃乃為書使使遺髙后妄言曰孤僨之君生於沮澤之中長於平野牛馬之域數至邉境願遊中國陛下獨立孤僨獨居兩主不樂無以自虞願以所有易其所無髙后大怒召丞相平及樊噲季布等議斬其使者發兵而欲擊之樊噲曰臣願得十萬衆橫行胸奴中問季布布諸將曰以髙帝賢武然尚困於平城噲可斬也前陳豨反於代漢兵三十二萬噲為上將軍時胸奴圍髙帝於平城噲不能解圍天下歌之曰平城之下亦誠苦七日不食不能彀弩今歌吟之聲未絶傷痍者甫起而噲欲搖動天下妄言以十萬衆橫行是面謾也且胸奴何與得失得其善言不足喜惡言不足怒也於是髙后乃止曰善令大謁者張澤報書曰單于不忘弊邑賜之以書弊邑恐懼退日自圖年老氣衰髮齒墮落行步失度單于過聽不足以自汙弊邑無罪冝在見赦竊有御車二乘馬二駟以奉常駕冒頓得書復使使來謝曰未嘗聞中國禮義陛下幸而赦之因獻馬遂復與胸奴和親至孝文帝初立即位復修和親之事其三年夏五月胸奴右賢王入居河南地為冦於是孝文帝下詔曰漢與胸奴約為昆弟無侵害邉境所以輸遺胸奴甚厚今右賢王離其國將衆居河南地非常故往來入塞捕殺吏卒驅侵盜上郡葆保塞蠻夷殺略人民令不得居其故陵轢邉吏入盜甚驁無道非約也於是孝文帝詔丞相灌嬰其發邉吏車騎八萬五千詣髙奴遣丞相灌嬰將擊右賢王右賢王走出塞文帝幸太原是時濟北王反文帝歸罷丞相擊胡之兵其明年單于遺漢書曰天所立胸奴大單于敬問皇帝無恙前時皇帝言和親事稱書意合歡歡漢邉吏侵侮右賢王右賢王不請聽後義盧侯難氏支等計與漢吏相距恨絶二主之約離兄昆弟之親皇帝讓書再至發使以書報不來漢使不至漢以其故不和鄰國不附令以小少吏之敗約故罰右賢王使之至西方求月氏擊之以天之福吏卒良馬彊力彊以夷滅夷月氏盡斬殺降下定之定樓蘭烏孫呼揭及其旁二十六國皆以已為胸奴諸引弓之民并為一家北州已以定願寢兵休士卒養馬除前事復故約以安邉民以應始古始使少者得成其長老者得安其處世世平樂未得皇帝之志也故使郎中係雩呼淺奉書請獻槖他一匹騎馬二匹駕二駟皇帝即不欲胸奴近塞則且詔吏民逺舍使者至即遣之以六月中來至薪新望之地書至漢議擊與和親孰便公卿皆曰單于新破月氏乘勝不可擊也且得胸奴地澤鹵非可居也和親甚便漢許之孝文皇帝前六年漢遺胸奴書曰皇帝敬問胸奴大單于無恙使郎中係雩呼淺遺朕書曰云右賢王不請聽後義盧侯難氏等計絶二主之約離兄弟之親漢以故不和鄰國不附今以小吏敗約故罰右賢王使西擊月氏盡定之願寢兵休士卒養馬除前事復故約以安邉民使少者得成其長老者安其處世世平樂朕甚嘉之此古聖王之意志也漢與胸奴約為兄弟所以遺單于甚厚倍背約離兄弟之親者常在胸奴然右賢王事已在赦前單于勿深誅單于若稱書意明告諸吏使無負約有信敬如單于書使者言單于自將伐并國有功甚苦兵事服繡夾綺衣繡夾長襦錦夾袍各一比余疏一黃金飾具帶一黃金胥紕犀毗一繡十匹錦三二十匹赤綈緑繒各四十匹使中大夫意謁者令肩遺單于後頃之冒頓死子稽粥立號曰老上單于老上稽粥單于初立孝文皇帝復遣宗室人女公翁主為單于閼氏使宦者燕人中行說傅公翁主說不欲行漢彊使之說曰必我行也為漢患者中行說既至因降單于單于甚親愛幸之初胸奴單于好漢繒絮食物中行說曰胸奴人衆不能當漢之一郡然所以彊之者以衣食異無仰卬於漢也今單于變俗好漢物漢物不過什二則胸奴盡歸於漢矣其得漢絮繒絮以馳草棘中衣袴皆裂敝以示視不如旃裘之完堅善也得漢食物皆去之以示視不如湩重酪之便美也於是說教單于左右疏記以計課識其人衆畜物牧漢遺單于書牘以尺一寸牘辭曰皇帝敬問胸奴大單于無恙所以遺物及言語云云中行說令單于遺漢書以尺二寸牘及印封皆令廣大長倨傲驁其辭曰天地所生日月所置胸奴大單于敬問漢皇帝無恙所以遺物言語亦云云漢使或言曰胸奴俗賤老中行說窮漢使曰而漢俗屯戌從軍當發者其老親豈有不自脫奪溫厚肥美以齎送飲食行戌者乎漢使曰然中行說曰胸奴明以戰攻戰為事其老弱不能鬬故以其肥美飲食壯健壯健者蓋以自為守衛如此父子各得久相保何以言胸奴輕老也漢使曰胸奴父子乃同穹廬而卧父死妻其後母兄弟死盡取妻其妻妻之無冠帶之飾節闕廷之禮中行說曰胸奴之俗人食畜肉飲其汁衣其皮畜食草飲水隨時轉移故其急則人習騎射寬則人樂無事其約束輕徑易行也君臣簡易可久一國之政猶一身體也父子兄弟死取則妻其妻妻之惡種姓之失也故胸奴雖亂必立宗種今中國雖詳陽不取其父兄之妻親屬益疏則相殺至乃到易姓皆從此類也且禮義之敝上下交怨望而室屋之極生力必屈焉夫力耕桑以求衣食築城郭以自備故其民急則不習戰功攻緩則罷於作業嗟土室之人顧無多辭令喋喋而占占冠固何當自是之後漢使欲辨論者中行說輒曰漢使無毋多言顧漢所輸胸奴繒絮米糵令其量中必善美而已矣何以言為言乎且所給備善則已不備善而苦惡則候秋熟以騎馳蹂而乃稼穡耳也日夜教單于候利害處孝文皇帝十四年胸奴單于十四萬騎入朝那蕭關殺北地都尉卬虜人民畜産甚多遂至止彭陽使竒騎兵入燒回中宫候騎至雍甘泉於是文帝以中尉周舍郎中令張武為將軍發車千乘騎十萬騎軍長安旁以備胡冦而拜昌侯盧卿為上郡將軍寧侯魏遫為北地將軍隆慮侯周竈為隴西將軍東陽侯張相如為大將軍成侯董赤為前將軍大發車騎往擊胡單于留塞內月餘乃去漢逐出塞即還不能有所殺胸奴日已以驕嵗入邉殺掠略人民畜産甚多衆雲中遼東最甚至代郡萬餘人漢甚患之乃乃使使遺胸奴書單于亦使當戶報謝復言和親事孝文帝後二年使使遺胸奴書曰皇帝敬問胸奴大單于無恙使當户且居渠雕渠難郎中韓遼遺朕馬二匹已至敬受先帝制長城以北引弓之國受命令單于長城以內冠帶之室朕亦制之使萬民耕織射獵衣食父子無毋離臣主相安俱無暴逆虐今聞泄惡民貪降其進取之利趨倍背義絶約忘萬民之命離兩主之歡然其事已在前矣書曰云二國已和親兩主歡說寢兵休卒飬馬世世昌樂闟翕然更始朕甚嘉之聖人者日新改作更始使老者得息幼者得長各保其首領而終其天命朕與單于俱由此道順天恤民世世相傳施之無窮天下莫不咸便嘉使漢與胸奴鄰國之敵之國胸奴處北地寒殺氣早降故詔吏遺單于秫糵金帛絲綿絮他它物嵗有數今天下大安萬民熙熙獨朕與單于為之父母朕追念前事薄物細故謀臣計失皆不足以離兄昆弟之歡朕聞天不頗覆地不偏載朕與單于皆捐往細故俱蹈大道也墮壞前惡以圖長久使兩國之民若一家子元元萬民下及魚鱉上及飛鳥跂行喙息蠕蠕動之類莫不就安利而辟避危殆故來者不止天之道也俱去前事朕釋逃虜民單于無毋言章尼等朕聞古之帝王約分明而無不食言單于留志天下大安和親之後漢過不先單于其察之單于既約和親於是制詔御史曰胸奴大單于遺朕書言和親已定亡人不足以益衆廣地胸奴無入塞漢無出塞犯令約者殺之可以久親後無咎俱便朕已許之其布告天下使明知之後四嵗年老上稽粥單于死子軍臣立為單于既立孝文皇帝復與胸奴和親而中行說復事之漢復與胸奴和親軍臣單于立四嵗嵗餘胸奴復絶和親大入上郡雲中各三萬騎所殺略甚衆而去於是漢使三將軍軍屯北地代屯句注趙屯飛狐口緣邉亦各堅守以備胡冦又置三將軍軍長安西細桞渭北棘門霸上以備胡胡騎入代句注邉烽火通於甘泉長安數月漢兵至邉胸奴亦去逺塞漢兵亦罷後歲餘孝文帝崩孝景帝立而趙王遂乃乃隂使人於胸奴吳楚反欲與趙合謀入邉漢圍破趙胸奴亦止自是之後孝景帝復與胸奴和親通關市給遺胸奴單于遣公翁主如故約終孝景帝世時時小入盜邉無大冦今武帝即位明和親約束厚遇通關市饒給之胸奴自單于以下皆親漢往來長城下漢使馬邑人聶翁一姧問蘭闌出物與胸奴交易詳陽為賣馬邑城以誘單于單于信之而貪馬邑財物乃乃以十萬騎入武州塞漢伏兵三十餘萬馬邑旁御史大夫韓安國為護軍將軍護四將軍以伏單于單于既入漢塞未至馬邑百餘里見畜布野而無人牧者怪之乃攻亭是時鴈門尉史行徼見冦葆保此亭知漢兵謀單于得欲殺刺之尉史知漢謀乃乃下具告單于漢兵所居單于大驚曰吾固疑之乃引兵還出曰吾得尉史天也天使若言以尉史為天王漢兵約單于入馬邑而縱兵單于不至以故漢兵無所得漢將軍王恢部出代擊胡輜重聞單于還兵多不敢出漢以恢本建造兵謀而不進斬誅恢自是之後胸奴絶和親攻當路塞往往入盜於漢邉不可勝數然胸奴貪尚樂關市嗜耆漢財物漢亦尚通關市不絶以中之自馬邑軍後五年嵗之秋漢使四將軍各萬騎擊胡關市下將軍衛青出上谷至籠龍城得胡首虜七百人公孫賀出雲中無所得公孫敖出代郡為胡所敗七千餘人李廣出鴈門為胡所敗而胸奴生得廣廣後得道亡歸漢囚敖廣敖廣贖為庶人其冬胸奴數千人入盜邉漁陽尤甚漢使將軍韓安國屯漁陽備胡其明年秋胸奴二萬騎入漢殺遼西太守略二千餘人胡又入敗漁陽太守軍千餘人圍漢將軍安國安國時千餘騎亦且盡㑹燕救之至胸奴乃乃去胸奴又入鴈門殺略千餘人於是漢使將軍衛青將三萬騎出鴈門李息出代郡擊胡得首虜數千人其明年衛青復出雲中以西至隴西擊胡之樓煩白羊王於河南得胡首虜數千牛羊百餘萬於是漢遂取河南地築朔方復繕故秦時蒙恬所為塞因河而為固利漢亦棄上谷之什斗辟縣造陽地以豫胡是嵗漢之元朔二年也其後冬胸奴軍臣單于死軍臣單于其弟左谷蠡王伊稚斜自立為單于攻破敗軍臣單于太子於單於單亡降漢漢封單于於單為涉陟安侯數月而死伊稚斜單于既立其夏胸奴數萬騎入殺代郡殺太守恭共友及略千餘人其秋胸奴又入鴈門殺略千餘人其明年胸奴又復入代郡定襄上郡各三萬騎殺略數千人胸奴右賢王怨漢奪之河南地而築朔方數為寇盜邉及入河南侵擾朔方殺略吏民甚衆其明年春漢以遣衛青為大將軍將六將軍十餘萬人出朔方髙闕擊胡右賢王以為漢兵不能至飲酒醉漢兵出塞六七百里夜圍右賢王右賢王大驚脫身逃走諸精騎往往隨後去漢將軍得右賢王人衆男女萬五千人裨小王十餘人其秋胸奴萬騎入殺代郡殺都尉朱英央略千餘人其明年春漢復遣大將軍衛青將六將軍兵十餘萬騎乃仍再出定襄數百里擊胸奴得首虜前後凡萬九千餘級而漢亦亡兩將軍軍三千餘騎右將軍建得以身脫而前將軍翕侯趙信兵不利降胸奴趙信者故胡小王降漢漢封為翕侯以前將軍與右將軍并軍分行介獨遇單于兵故盡沒單于既得翕侯以為自次王用其姊妻之與謀漢信教單于益北絶幕以誘罷漢兵徼極而取之無毋近塞單于從其計之其明年胡騎數萬人騎入上谷殺數百人其明年春漢使驃騎將軍去病將萬騎出隴西過焉支耆山千餘里擊胸奴得胡首虜騎萬八千餘級破得休屠王祭天金人其夏驃騎將軍復與合騎侯數萬騎出隴西北地二千里擊胸奴過居延攻祁連山得胡首虜三萬餘人級裨小王以下七十餘人是時胸奴亦來入代郡鴈門殺略數百人漢使博望侯及李將軍廣出右北平擊胸奴右左賢王右左賢王圍李將軍廣卒可廣軍四千人且盡死者過半殺虜亦過當㑹博望侯軍救至李將軍得脫漢盡失亡數千人其軍合騎侯後驃票騎將軍期及與博望侯皆當死贖為庶人其秋單于怒渾昆邪王休屠王居西方為漢所殺虜數萬人欲召誅之渾昆邪王與休屠王恐謀降漢漢使驃騎將軍往迎之渾昆邪王殺休屠王并將其衆降漢凡四萬餘人號十萬於是漢已得渾昆邪王則隴西北地河西益少胡冦徙關東貧民處所奪胸奴河南地新秦中以實之而減北地以西戌卒半其明年春胸奴入右北平定襄各數萬騎殺略千餘人而去其明年春漢謀曰以為翕侯信為單于計居幕北以為漢兵不能至乃粟馬發十萬騎私負私從馬凡十四萬匹糧重不與焉令大將軍青驃票騎將軍去病中分軍大將軍出定襄驃票騎將軍出代咸約絶幕擊胸奴胸奴單于聞之逺其輜重以精兵待於幕北與大將軍接戰一日㑹暮大風起漢兵縱左右翼圍單于單于自度戰不能如與漢兵單于遂獨身與壯騎數百潰漢圍西北遁走漢兵夜追之不得行斬捕斬胸奴首虜凡萬九千級北至闐填顔山趙信城而還單于之遁走其兵往往與漢兵軍相亂而隨單于單于久不與其大衆相得其右谷蠡王以為單于死乃自立為單于真單于復得其衆而右谷蠡王乃去其單于號復其故位為右谷蠡王漢驃票騎將軍之出代二千餘里與左賢王接戰漢兵得胡首虜凡七萬餘級人左賢王將皆遁走驃票騎封於狼居胥山禪姑衍臨翰海而還是後胸奴逺遁而幕南無王庭漢度河自朔方以西至令居往往通渠置田官吏卒五六萬人稍𧖟食地接胸奴以北初漢兩將軍大出圍單于所殺虜八九萬而漢士卒物故者亦萬數萬漢馬死者十餘萬匹胸奴雖病逺去而漢亦馬亦少無以復往胸奴單于用趙信之計遣使於漢好辭請和親天子下其議或言和親或言遂臣之丞相長史任敞曰胸奴新破困宜可使為外臣朝請於邉漢使任敞使於單于單于聞敞計大怒留之不遣先是漢亦有所降胸奴使者單于亦輒留漢使相當漢方復收士馬㑹驃票騎將軍去病死於是漢久不北擊胡數嵗伊稚斜單于立十三年死子烏維立為單于是嵗漢元鼎三年也烏維單于立而漢天子武帝始出巡狩郡縣其後漢方南誅兩越不擊胸奴胸奴亦不侵入邉烏維單于立三年漢已滅南兩越遣故太僕公孫賀將萬五千騎出九原二千餘里至浮苴井而還不見胸奴一人漢又遣故從驃票侯趙破奴萬餘騎出令居數千里至胸奴河水而還亦皆不見胸奴一人而還是時天子巡邉親至朔方勒兵十八萬騎以見武節而使郭吉風告單于郭吉既至胸奴胸奴主客問所使郭吉禮卑體言好言曰吾見單于而口言單于見吉吉曰南越王頭已懸縣於漢北闕下今單于能即能前與漢戰天子自將兵待邉單于即不能即亟南面而臣於漢何徒但逺走亡匿於幕北寒苦無水草之地毋為也語卒而單于大怒立斬主客見者而留郭吉不歸遷辱之北海上而單于終不肻為寇於漢邉休養息士馬習射獵數使使於漢好辭甘言求請和親漢使王烏等窺窺胸奴胸奴法漢使非不去節而不以墨黥其面者不得入穹廬王烏北地人習胡俗去其節黥面而得入穹廬單于愛之詳陽許曰吾甘言為遣其太子入漢為質於漢以求和親漢使楊信使於胸奴是時漢東拔穢濊貉朝鮮以為郡而西置酒泉郡以鬲隔絶胡與羌通之路漢又西通月氏大夏又以公翁主妻烏孫王以分胸奴西方之援國又北益廣田至胘靁胝雷為塞而胸奴終不敢以為言是嵗翕侯信死漢用事者以胸奴為已弱可臣從也楊信為人剛直屈彊素非貴臣也單于不親單于欲召入不肻去節單于乃坐穹廬外見楊信楊信既見說單于說曰即欲和親以單于太子為質於漢單于曰非故約故約漢常遣公翁主給繒絮食物有品以和親而胸奴亦不復擾邉今乃欲反古令吾太子為質無幾矣胸奴俗見漢使非中貴人其儒先生以為欲說折其辭辨其少年以為欲刺折其氣每漢使兵入胸奴胸奴輒報償漢留胸奴使胸奴亦留漢使必得當乃肻止楊信既歸漢使王烏而單于等如胸奴胸奴復讇以甘言欲多得漢財物紿謂王烏曰吾欲入漢見天子面相約結為兄弟王烏歸報漢漢為單于築邸于長安胸奴曰非得漢貴人使吾不與誠語胸奴使其貴人至漢病漢豫服藥欲愈之不幸而死而漢使路充國佩二千石印綬往使因送其喪厚葬幣直數千金曰此漢貴人也單于以為漢殺吾貴使者乃留路充國不歸諸所言者單于特空紿王烏殊無意入漢及遣太子來質於是胸奴數使竒兵侵犯漢邉漢乃乃拜郭昌為拔胡將軍及浞野侯屯朔方以東備胡路充國留胸奴三嵗單于死烏維單于立十嵗死死子烏詹師廬立為單于年少號為兒單于是嵗元封六年也自此之是後單于益西北左方兵直雲中右方兵直酒泉燉煌郡兒單于立漢使兩使者一人弔單于一人弔右賢王欲以乖其國使者入胸奴胸奴悉將致單于單于怒而盡悉留漢使漢使留胸奴者前後十餘輩而胸奴使來漢亦輒留之相當是嵗漢使二師將軍廣利西伐大宛而令因杅將軍敖築受降城其冬胸奴大雨雪畜多饑寒死而兒單于年少好殺伐國中人多不安左大都尉欲殺單于使人間告漢曰我欲殺單于降漢漢逺漢即兵來兵迎近我我即發初漢聞此言故築受降城猶以為逺其明年春漢使浞野侯破奴將二萬餘騎出朔方西北二千餘里期至浚稽山而還浞野侯既至期而還左大都尉欲發而覺單于誅之發左方兵擊浞野侯浞野侯行捕首虜數千人還未至受降城四百里胸奴兵八萬騎圍之浞野侯夜自出自求水胸奴間捕生得浞野侯因急擊其軍軍吏中郭縱為護維王為渠相與謀曰及諸校尉畏亡將軍而誅之莫相勸而歸軍遂沒于胸奴胸奴兒單于大喜遂遣竒兵攻受降城不能下乃寇侵入邉而去其明年單于欲自攻受降城未至到病死兒單于立三嵗而死子年少胸奴乃乃立其季父烏維單于弟右賢王詬句犁黎湖為單于是嵗太初三年也詬句犁黎湖單于立漢使光祿徐自為出五原塞數百里逺者千餘里築城障列亭至廬盧朐而使遊擊將軍韓說長平矦衛伉屯其旁使彊弩都尉路博德築居延澤上其秋胸奴大入定襄雲中定襄五原朔方殺略數千人敗數二千石而去行破壞光祿所築城列亭鄣障又使右賢王入酒泉張掖略數千人㑹任文擊救盡復失其所得而去是嵗聞二師將軍破大宛斬其王而還胸奴單于欲遮之不能敢至其冬欲攻受降城㑹單于病死詬句犁黎湖單于立一嵗死胸奴乃立其弟左大都尉且鞮侯立為單于漢既誅大宛威震外國天子意欲遂困胡乃乃下詔曰髙皇帝遺朕平城之憂髙后時單于書絶悖逆昔齊襄公復百九世之讐春秋大之是嵗太初四年也且鞮侯單于既初立恐漢襲之盡歸漢使之不降者路充國等於漢得歸單于初立恐漢襲之乃自謂我兒子安敢望漢天子漢天子我丈人行也漢遣中郎將蘇武厚幣賂遺單于單于益驕禮甚倨非漢所望也其明年浞野侯破奴得亡歸漢其明年漢使二師將軍廣利以將三萬騎出酒泉擊右賢王於天山得胡首虜萬餘級而還胸奴大圍二師將軍幾不得脫漢兵物故什六七漢復又使因杅將軍敖出西河與彊弩都尉㑹涿涂邪山毋亡所得又使騎都尉李陵將步騎兵五千人出居延北千餘里與單于㑹合戰陵所殺傷萬餘人兵及食盡欲解歸胸奴單于圍陵陵降胸奴其兵遂沒得還脫歸漢者四百人單于乃乃貴陵以其女妻之後二嵗漢復使二師將軍將六萬騎步兵十七萬出朔方彊弩都尉路博德將萬餘人與二師㑹游擊將軍說將步騎兵三萬人出五原因杅將軍敖將萬騎萬步兵三萬人出鴈門胸奴聞悉逺其纍重於余吾水北而單于以十萬騎待水南與二師將軍接戰二師乃解而引歸與單于連戰鬬十餘日二師聞其家以巫蠱族滅因并衆降胸奴得來還千人一兩人耳游擊說亡所得因杅敖與左賢王戰不利引歸是嵗漢兵之出擊胸奴者不得言功多少功不得御有詔捕太醫令隨但言二師將軍家室族滅使廣利得降胸奴史記文止此漢書未終太史公曰孔子著春秋隱桓之間則章至定哀之際則微為其切當世之文而罔褒忌諱之辭也世俗之言胸奴者患其僥一時之權而務讇納其說以便偏指不參彼已將率席中國廣大氣奮人主因以决䇿是以建功不深堯雖賢興事業不成得禹而九州寧且欲興聖統維在擇任將相哉唯在擇任將相哉贊曰書戒蠻夷猾夏詩稱戎狄是膺春秋有道守在四夷久矣夷狄之為患也故自漢興忠言嘉謀之臣曷嘗不運籌䇿相與爭於廟堂之上乎髙祖時則劉敬吕后時樊噲季布孝文時賈誼朝錯孝武時王恢韓安國朱買臣公孫𢎞董仲舒人持所見各有同異然總其要歸兩科而已縉紳之儒則守和親介胃之士則言征伐皆偏見一時之利害而未究胸奴之終始也自漢興以至于今曠世歷年多於春秋其與胸奴有修文而和親之矣有用武而克伐之矣有卑下而承事之矣有威服而臣畜之矣詘伸異變彊弱相反是故其詳可得而言也昔和親之論發於劉敬是時天下初定新遭平城之難故從其言約結和親賂遺單于冀以救安邉境孝惠髙后時遵而不違胸奴寇盜不為衰止而單于反以加驕倨逮至孝文與通關市妻以漢女增厚其賂嵗以千金而胸奴數背約束邉境屢被其害是以文帝中年赫然發憤遂躬戎服親御鞍馬從六郡良家材力之士馳射上林講習戰陳聚天下精兵軍於廣武顧問馮唐與論將帥喟然歎息思古名臣此則和親無益已然之明效也仲舒親見四世之事猶復欲守舊文頗增其約以為義動君子利動貪人如胸奴者非可以仁義說也獨可說以厚利結之於天耳故與之厚利以沒其意與􅉀於天以堅其約質其愛子以纍其心胸奴雖欲展轉奈失重利何奈欺上天何奈殺愛子何夫賦斂行賂不足以當三軍之費城郭之固無以異於貞士之約而使邉城守境之民父兄緩帶稚子咽哺胡馬不窺於長城而羽檄不行於中國不亦便於天下乎察仲舒之論考諸行事乃知其未合於當時而有闕於後世也當孝武時雖征伐克獲而士馬物故亦略相當雖開河南之野建朔方之郡亦棄造陽之北九百餘里胸奴人民每來降漢單于亦輒拘留漢使以相報復其桀驁尚如斯安肯以愛子而為質乎此不合當時之言也若不置質空約和親是襲孝文既往之悔而長胸奴無已之詐也夫邉城不選守境武略之臣修障隧備塞之具厲長㦸徑弩之械恃吾所以待邉冦而務賦斂於民遠行貨賂割剝百姓以奉寇讐信甘言守空約而幾胡馬之不窺不已過乎至孝宣之世承武帝奮擊之威直胸奴百年之運因其壞亂幾亡之厄權時施宜覆以威德然後單于稽首臣服遣子入侍三世稱藩賔於漢庭是時邉城晏閉牛馬布野三世無犬吠之警黎庶亡干戈之役後六十餘載之間遭王莽篡位始開邉隙單于由是歸怨自絶莽遂斬其侍子邉境之禍搆矣故呼韓邪始朝於漢漢議其儀而蕭望之曰戎狄荒服言其來服荒忽無常時至時去宜待以客禮讓而不臣如其後嗣􅋟逃竄伏使於中國不為叛臣及孝元時議罷守塞之備侯應以為不可可謂盛不忘衰安必思危遠見識微之明矣至單于咸棄其愛子昧利不顧侵掠所獲嵗巨萬計而和親賂遺不過千金安在其不棄質而失重利也仲舒之言漏於是矣夫規事建議不圖萬世之固而偷恃一時之事者未可以經遠也若乃征伐之功秦漢行事嚴尤論之當矣故先王度土中立封畿分九州列五服物土貢制外內或修政刑或昭文德遠近之藝異也是以春秋內諸夏而外夷狄夷狄之人貪而好利被髮左衽人各其心其與中國殊章服異習俗飲食不同言語不通辟居北垂寒露之野逐草隨畜射獵為生隔以山谷雍以沙幕天地所以絶外內也是故聖王以德綏之不與約誓不就攻伐約之則費賂而見欺攻之則勞師而招寇其地不可耕而食也其民不可臣而畜也是以外而不內疏而不戚政教不及其人正朔不加其國來則懲而御之去則備而守之其慕義而貢獻則接之以禮讓羈靡不絶使曲在彼蓋聖王制御蠻夷之常道也班馬異同卷二十三
