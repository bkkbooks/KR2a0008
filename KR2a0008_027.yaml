body:
  text: 班馬異同卷二十七宋倪思編司馬相如傳下漢書五十七相如為郎數嵗會唐蒙使略通夜郎西僰中發巴蜀吏卒千人郡又多為發轉漕萬餘人用軍興法誅其渠帥率巴蜀民大驚恐上聞之乃使遣相如責唐蒙等因喻告巴蜀民以非上意檄曰告巴蜀太守蠻夷自擅不討之日久矣時侵犯邉境勞士大夫陛下即位存撫天下輯集安中國然後興師出兵北征胸奴單于怖駭交臂受事詘屈膝請和康居西域重譯請朝納貢稽首來享移師東指閩越相誅右弔番禺太子入朝南夷之君西僰之長常效貢職不敢怠墮惰怠延頸舉踵喁喁然皆爭歸鄉風慕義欲為臣妾道里遼逺山川阻深不能自致夫不順者已誅而為善者未賞故遣中郎將往賓之發巴蜀之士民各五百人以奉幣帛衛使者不然靡有兵革之事戰鬬之患今聞其乃發軍興制驚懼子弟憂患長老郡又擅為轉粟運輸皆非陛下之意也當行者或亡逃自賊殺亦非人臣之節也夫邉郡之士聞烽烽舉燧燔皆攝弓而馳荷兵而走流汗相屬惟恐居後觸白刃冒流矢義議不反顧計不旋踵人懷怒心如報私讐彼豈樂死惡生非編列之民而與巴蜀異主哉計深慮逺急國家之難而樂盡人臣之道也故有剖符之封析圭而爵位為通侯居列東第終則遺顯號於後世傳土地於子孫事行事甚忠敬居位甚安佚名聲施於無窮功列著而不滅是以賢人君子肝腦塗中原膏液潤野草野􅋄而不辭也今奉幣役使至南夷即自賊殺或亡逃抵誅身死無名諡為至愚恥及父母為天下笑人之度量相越豈不逺哉然此非獨行者之罪也父兄之教不先子弟之率不謹也寡亷鮮恥而俗不長厚也其被刑戮不亦宜乎陛下患使者有司之若彼悼不肖愚民之如此故遣信使曉喻諭百姓以發卒之事因數之以不忠死亡之罪讓三老孝弟以不教誨之過責方今田時重煩百姓已親見近縣恐逺所溪谷山澤之民不遍聞檄到亟下縣道使咸知諭陛下之意唯毋忽也相如還報唐蒙已略通夜郎因通西南夷道發巴蜀廣漢卒作者數萬人治道二嵗道不成士卒多物故費以巨億萬計蜀民及漢用事者多言其不便是時邛筰之君長聞南夷與漢通得賞賜多多欲願為內臣妾請吏比南夷天子上問相如相如曰邛筰冉駹者近蜀道亦易通秦異時嘗通為郡縣矣至漢興而罷今誠復通為置郡縣愈於南夷天子上以為然乃拜相如為中郎將建節往使副使者王然于壺充國吕越人馳四乘之傳因巴蜀吏幣物以賂西南夷至蜀蜀太守以下郊迎縣令負弩矢先驅蜀人以為寵於是卓王孫臨邛諸公皆因門下獻牛酒以交歡卓王孫喟然而嘆自以得使女尚司馬長卿晚而乃厚分與其女財與男等同司馬長卿相如使便略定西南夷邛筰冉駹斯榆之君皆請為內臣妾除邉關邉關益斥西至沫若水南至牂牁柯為徼通零關靈山道橋孫水以通邛都筰還報天子天子大説相如使時蜀長老多言通西南夷之不為用唯大臣亦以為然相如欲諫業已建之不敢乃著書籍以蜀父老為辭而已詰難之以風天子且因宣其使指令百姓皆知天子之意其辭曰漢興七十有八載德茂存乎六世威武紛紜云湛恩汪濊羣生澍霑濡洋益溢乎方外於是乃命使西征隨流而攘風之所被罔不披靡因朝冉從駹定筰存邛略斯榆舉苞滿滿結軌還轅東鄉將報至于蜀都耆老大夫薦搢紳先生之徒二十有七人儼然造焉辭畢因進曰蓋聞天子之於夷狄也其義羈縻勿絶而已今罷三郡之士通夜郎之塗三年於兹而功不竟士卒勞倦萬民不贍今又接之以西夷百姓力屈恐不能卒業此亦使者之纍也竊為左右患之且夫邛筰西僰之與中國並也歷年兹多不可記已仁者不以德來強者不以力并意者其殆不可乎今割齊民以附夷狄弊所恃以事無用鄙人固陋不識所謂使者曰烏謂此邪乎必若所云則是蜀不變服而巴不化俗也余僕尚惡聞若説然斯事體大固非觀者之所覯也余之行急其詳不可得聞已請為大夫粗陳其略蓋世必有非常之人然後有非常之事有非常之事然後有非常之功非常者固常人之所異也故曰非常之原元黎民懼焉及臻厥成天下晏如也昔者鴻水浡沸出泛濫衍溢民人登升降移徙崎嶇崎嶇而不安夏后氏戚之乃堙鴻水洪原決江疏河漉灑沈贍淡災災東歸之於海而天下永寧當斯之勤豈惟民哉心煩於慮而身親其勞躬傶骿胝無胈膚不生毛故休烈顯乎無窮聲稱浹乎于兹且夫賢君之踐位也豈特委瑣握􅐅拘文牽俗循誦習傳當世取説云爾哉必將崇論閎谹議創業垂統為萬世規故馳騖乎兼容并包而勤思乎參天二地且詩不云乎普天之下莫非王土率土之濱莫非王臣是以六合之內八方之外浸潯淫衍溢懷生之物有不浸潤於澤者賢君耻之今封強之內冠帶之倫咸獲嘉祉靡有闕遺矣而夷狄殊俗之國遼絶異黨之地域舟輿車不通人迹罕至政教未加流風猶微內之則犯義侵禮於邉境外之則邪行橫作放弒殺其上君臣易位尊卑失序父兄不辜幼孤為奴虜係纍絫號泣內嚮鄉而怨曰蓋聞中國有至仁焉德洋而恩普物靡不得其所今獨曷為遺已舉踵思慕若枯旱之望雨盩夫為之垂涕况乎上聖又惡烏能已故北出師以討強胡南馳使以誚徑越四面風德二方之君鱗集仰流願得受號者以億計故乃關沫若徼牂牁柯鏤零靈山梁孫原創道德之塗垂仁義之統將博恩廣施逺撫長駕使疏逖不閉阻深曶爽暗昧得耀乎光明以偃甲兵於此而息討誅伐於彼遐邇一體中外提禔福不亦康乎夫拯民於沉溺奉至尊之休德反衰世之陵遲夷繼周氏之絶業斯乃天子之急務也百姓雖勞又惡烏可以已哉且夫王者事固未有不始於憂勤而終於佚樂者也然則受命之符合在於此矣方將增泰太山之封加梁父之事鳴和鸞揚樂頌上咸五下登三觀者未暏指聽者未聞音猶鷦明焦朋已翔乎寥廓而羅者猶視乎藪澤悲夫於是諸大夫芒茫然喪其所懷來而失厥所以進喟然並稱曰允哉漢德此鄙人之所願聞也百姓雖怠勞請以身先之敞罔靡徙因遷延而辭避其後人有上書言相如使時受金失官居嵗餘復召為郎相如口吃而善著書常有消渴疾病與卓氏婚饒於財故其進仕事宦未嘗肻與公卿國家之事常稱病疾間居不慕官爵常從上至長楊獵是時天子方好自擊熊彘豕馳逐野野獸相如因上疏諫之其辭曰臣聞物有同類而殊能者故力稱烏獲捷言慶忌勇期賁育臣之愚竊以為人誠有之獸亦冝然今陛下好陵阻險射猛獸卒然遇軼逸材之獸駭不存之地犯屬車之清塵輿不及還轅人不暇施巧雖有烏獲逢蒙之伎力不得用枯木朽株盡為害難矣是胡越起於轂下而羌夷接軫也豈不殆哉雖萬全而無患然本非天子之所宜近也且夫清道而後行中路而後馳猶時有銜橛之變而况乎涉乎蓬蒿豐草馳騁乎丘墳虛前有利獸之樂而內無存變之意其為禍害也不亦難矣夫輕萬乘之重不以為安而樂出於萬有一危之塗以為娛臣竊為陛下不取也蓋明者逺見於未萌而智者避危於無形禍固多藏於隱微而發於人之所忽者也故鄙諺曰家纍絫千金者坐不垂堂此言雖小可以喻諭大臣願陛下之留意幸察上善之還過宜春宮相如奏賦以哀二世行失也其辭曰登陂陀之長阪兮坌入曽宫之嵳峩臨曲江之隑州兮望南山之參差巖巖深山之谾谾兮通谷豁兮谽􅹼谺汨淢吸習靸以永逝兮注平臯之廣衍觀衆樹之塕蓊薆兮覽竹林之榛榛東馳土山兮北揭石瀨彌弭節容與兮歷弔二世持身不謹兮亡國失勢信讒不寤兮宗廟滅絶嗚呼烏乎哀哉操行之不得兮墳墓蕪穢而不修兮魂無亡歸而不食敻邈絶而不齊兮彌久逺而愈佅精罔閬而飛揚兮拾九天而永逝嗚呼哀哉相如拜為孝文園令天子上既美子虛之事相如見上好仙道因曰上林之事未足美也尚有靡者臣嘗為大人賦未就請具而奏之相如以為列仙之傳儒居山澤間形容甚臞此非帝王之仙意也乃遂就奏大人賦其辭曰世有大人兮在于乎中州宅彌萬里兮曽不足以少留悲世俗之迫隘兮朅輕舉而逺遊垂乘絳幡之素霓兮載雲氣而上浮建格澤之長修竿兮總光耀之采旄垂旬始以為幓兮抴曳彗星而為髾掉指橋以偃蹇寋兮又旖旎猗抳以招搖攬欃槍以為旌兮靡屈虹而為綢紅杳渺眇以眩玄湣兮焱風涌而雲浮駕應龍象輿之蠖略逶委麗兮驂赤螭青虯虬之􅝦蚴蟉蜿蜒低卬夭蟜據裾以驕驁兮詘折隆窮躩以連卷沛艾赳螑仡以佁擬兮放散畔岸驤以孱顔跮踱輵轄螛容以委骩麗兮綢繆蜩蟉偃蹇寋怵㲋以梁倚糾蓼叶奡踏踏以艐朡路兮蔑蒙踊躍騰而狂趡趭蒞颯卉卉翕歙熛焱至電過兮煥然霧除霍然雲消邪絶少陽而登太隂兮與真人乎相求互折窈窕以右轉兮橫厲飛泉以正東悉徴靈圉而選之兮部乘署衆神於瑶光使五帝先導兮反太一一而從陵陽左玄冥而右含黔靁兮前陸長離而後潏湟矞皇厮征伯僑而役羡門兮屬詔岐伯使尚方祝融驚警而蹕御兮清氛氣氛而後行屯余車其而萬乘兮綷雲蓋而樹華旗使勾芒其將行兮吾欲往乎南嬉娭歷唐堯於崇山兮過虞舜於九疑紛湛湛其差錯兮雜遝膠葛輵以方馳騷擾衝蓯其相紛拏兮滂濞泱軋灑麗以林離鑽攢羅列聚叢以蘢茸兮衍曼流爛壇痑以陸離徑入靁雷室之砰磷鬱律兮洞出鬼谷之崫堀礨嵬𥑋崴魁遍覽八紘而觀四荒海兮朅渡九江而越五河經營炎火而浮弱水兮杭絶浮渚而涉流沙奄息總蔥極泛濫水嬉娭兮使靈媧鼓瑟琴而舞馮夷時若薆薆曖曖將混濁兮召屏翳誅風伯而刑雨師西望崑崙之軋沕洸荒忽兮直徑馳乎三危排閶闔而入帝宫兮載玉女而與之歸舒登閬風而搖遙集兮亢烏騰而一一止低回隂山翔以紆曲兮吾乃今目日睹西王母皬皓然白首戴勝而穴處兮亦幸有三足烏為之使必長生若此而不死兮雖濟萬世不足以喜回車朅來兮絶道不周會食幽都呼吸沆瀣兮飱朝霞兮噍咀芝英兮嘰瓊華嬐侵潯僸祲尋而髙縱兮紛鴻涌溶而上厲貫列缺之倒景兮涉豐隆之滂沛濞馳騁遊道而循修降兮騖遺霧而逺逝迫區中之隘陜兮舒節出乎北垠遺屯騎於玄闕兮軼先驅於寒門下崢嶸而無地兮上寥嵺廓而無天視眩眠泯而無亡見兮聽惝恍敞恍而無亡聞乘虛無亡而上假遐兮超無友而獨存相如既奏大人之頌賦天子大説飄飄有凌陵雲之氣似遊天地之間意相如既病免家居茂陵天子曰司馬相如病甚可往從悉取其書若不然後失之矣使所忠往而相如已死家無遺書問其妻對曰長卿固未嘗有書也時時著書人又取去即空居長卿未死時為一卷書曰有使者來求書奏之無他書其遺札書言封禪事奏所忠所忠奏其書焉天子異之其書辭曰伊上古之初肇自昊灝穹兮生民歷撰選列辟以迄于乎秦率邇者踵武逖聽逖者風聲紛綸葳㽔堙滅而不稱者不可勝數也續韶繼昭夏崇號諡略可道者七十有二君罔若淑而不昌疇逆失而能存軒轅之前遐哉邈乎其詳不可得聞也已五三六經載籍之傳維見可觀也書曰元首明哉股肱良哉因斯以談君莫盛於唐堯臣莫賢於后稷后稷創業於唐公劉發迹於西戎文王改制爰周郅隆大行越成而後后陵夷遲衰微千載無亡聲豈不善始善終哉然無異端慎所由於前謹遺教於後耳故軌迹夷易易遵也湛恩蒙涌龎洪易豐也憲度著明易則也垂統理順易繼也是以業隆於襁褓而崇冠乎于二后揆厥所元終都攸卒未有殊尤絶迹可考于於今者也然猶躡梁父甫登泰太山建顯號施尊名大漢之德烽逢涌原泉沕潏漫衍曼羡旁魄四塞雲專布霧散上暢九垓下泝八埏懷生之類霑濡浸潤協氣橫流武節飄焱逝邇爾陜狹遊原迥闊泳沫末首惡湮鬱沒暗昧昭哲晰昆蟲凱澤闓懌回首面內然後囿騶虞之珍羣僥麋鹿之怪獸䆃導一莖六穗於庖犧雙觡共抵之獸獲周餘珍牧放龜于岐招翠黃乘龍於沼鬼神接靈圉賓於間館竒物譎詭俶儻窮變欽哉符瑞臻兹猶以為薄不敢道封禪蓋周躍魚隕杭休之以燎微夫斯之為符也以登介山丘不亦恧乎進讓攘之道其何其爽歟於是大司馬進曰陛下仁育羣生義征不憓譓諸夏樂貢百蠻執贄德侔往初功無與二休烈浹液洽符瑞衆變期應紹至不特創見意者泰太山梁父設壇場望幸蓋號以况榮上帝垂恩儲祉將以薦慶成陛下謙嗛讓而弗發也挈三神之歡歡缺王道之儀羣臣恧焉或謂且天為質暗示珍符固不可辭若然辭之是泰山靡記而梁父靡罔幾也亦各並時而榮咸濟厥世而屈説者尚何稱於後而云七十二君乎哉夫修德以錫符奉符以行事不為進越也故聖王弗替而修禮地祗謁欵天神勤功中嶽嶽以彰至尊舒盛德發號榮受厚福以浸黎民也皇皇哉斯事天下之壯觀王者之丕卒業不可貶也願陛下全之而後因雜薦縉紳先生之略術使獲耀曜日月之末光絶炎以展采錯事猶兼正列其義挍飭祓飾厥文作春秋一藝將襲舊六為七攄之無窮俾萬世得激清流揚微波蜚英聲騰茂實前聖之所以永保鴻名而常為稱首者用此冝命掌故悉奏其義儀而覽焉於是天子沛然改容曰愈俞乎朕其試哉乃遷思回慮總公卿之議詢封禪之事詩大澤之博廣符瑞之富乃遂作頌曰自我天覆雲之油油甘露時雨厥壤可遊滋液滲漉何生不育嘉榖六穗我穡曷蓄非唯雨之又潤澤之非唯濡之偏我泛專布濩之萬物熙熙懷而慕思之名山顯位望君之來君乎兮君乎兮侯不邁哉般般之獸樂我君囿圃白質黑章其儀可嘉喜旻旻睦睦穆穆君子之能態蓋聞其聲今觀視其來厥塗靡蹤從天瑞之徴兹亦爾於舜虞氏以興濯濯之麟遊彼靈畤孟冬十月君徂郊祀馳我君輿帝以用享祉三代之前蓋未嘗有宛宛黃龍興德而升采色炫玄耀熿煥炳輝湟煌正陽顯見覺寤黎蒸於傳載之云受命所乘厥之有章不必諄諄依類記託寓諭以封巒披藝觀之天人之際已交上下相發允答聖王之德事兢兢翼翼也故曰於興必慮衰安必思危是以湯武至尊嚴不失肅祗舜在假典顧省厥遺此之謂也司馬相如既卒五嵗天子上始祭后土八年而遂先禮中嶽嶽封于太山至梁甫禪肅然相如他它所著若遺平陵侯書與五公子相難草木書篇不采采其尤著公卿者云太史公贊曰司馬遷稱春秋推見至隱易本隱以之顯大雅言王公大人而德逮黎庶小雅譏小己之得失其流及上所以言雖外殊其合德一也相如雖多虛辭濫説然要其要歸引之於節儉此亦與詩之風諫何異揚雄以為靡麗之賦勸百而風一猶馳騁鄭衛之聲曲終而奏雅不已虧戲乎余采其語可論者著于篇班馬異同卷二十七
