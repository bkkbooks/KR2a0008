body:
  text: 班馬異同卷五宋倪思編留侯世家第二十五史記五十五張陳王周傳第十漢書四十留侯張良者字子房其先韓人也大父開地相韓昭侯宣惠王襄哀王父平相釐王悼惠王悼惠王二十三年平卒卒二十嵗秦滅韓良年少未宦事韓韓破良家僮三百人弟死不葬悉以家財求客刺秦王為韓報仇以大父父五世相韓故良嘗學禮淮陽東見倉海君得力士為鐵椎重百二十斤秦皇帝東逰至博狼沙中良與客狙擊秦皇帝博浪沙中誤中副車秦皇帝大怒大索天下求賊甚急甚為張良故也良乃更名姓亡匿下邳良嘗間從容步遊下邳圮上有一老父衣褐至良所直墮其履圯下顧謂良曰孺子下取履良愕然欲歐之為其老乃疆忍下取履父曰履我良業為取履因長跪進履之父以足受之笑而去良殊大驚隨目之父去里所復還曰孺子可教矣後五日平眀與我會期此良因怪之跪曰諾五日平眀良往父已先在怒曰與老人期後何也去曰後五日早蚤會五日雞鳴良往父又先在復怒曰後何也去曰後五日復早蚤來五日良夜未半往有頃父亦來喜曰當如是出一編書曰讀此是則為王者師矣後十年興十三年孺子見我濟北榖城山下黃石即我矣已遂去無他言不復見旦日視其書乃乃太公兵法也良因異之常習誦讀之居下邳為任俠項伯嘗殺人從良匿後十年陳涉等起兵良亦聚少年百餘人景駒自立為楚假王在陳留良欲往從之行道遇沛公沛公將數千人略地下邳西遂屬焉沛公拜良為廏將良數以太公兵法説沛公沛公善之喜常用其䇿良為他它人言皆不省良曰沛公殆天授故遂從之不去見景駒及沛公之薛見項梁項梁共立楚懷王良乃説項梁曰君已立楚後而韓諸公子橫陽君成賢可立為王益樹黨項梁使良求韓成立以為韓王以良為韓申司徒與韓王將千餘人西略韓地得數城秦輒復取之往來為遊兵潁川沛公之從雒陽南出轘轅良引兵從沛公下韓十餘城擊破楊熊軍沛公乃令韓王成留守陽翟與良俱南攻下宛西入武關沛公欲以兵二萬人擊秦嶢關下軍良説曰秦兵尚強未可輕臣聞其將屠者子賈豎易動以利願沛公且留壁使人先行為五萬人具食益為張旗幟諸山上為疑兵令酈食其持重寶啖秦將秦將果叛欲連和俱西􅊞咸陽沛公欲聽之良曰此獨其將欲叛耳恐士卒恐不從不從必危不如因其解擊之沛公乃引兵擊秦軍大破之遂北至藍田再戰秦兵竟敗遂至咸陽秦王子嬰降沛公沛公入秦宫宫室帷帳狗馬重寶婦女以千數意欲留居之樊噲諫沛公出舍沛公不聽徐廣曰一本云噲諌曰沛公欲有天下耶將欲為富家翁耶沛公曰吾欲有天下噲曰今臣從入秦宫所觀宫室帷帳珠玉重寶鍾鼓之飾竒物不可勝極入其後宫美人婦女以千數此皆秦所以亡天下也願沛公急還霸上無留宫中沛公不聽良曰夫秦為無道故沛公得至此夫為天下除殘去賊宜縞素為資今始入秦即安其樂此所謂助桀為虐且忠言逆耳利于行毒藥苦口利于病願沛公聽樊噲言沛公乃還軍霸上項羽至鴻門下欲擊沛公項伯乃夜馳入至沛公軍私見張良欲與俱去良曰臣為韓王送沛公今事有急亡去不義乃乃具以語沛公沛公大驚曰為之將奈何良曰沛公誠欲背項羽王邪沛公曰鯫生教説我距關無毋內諸侯秦地可盡王也故聽之良曰沛公自度能郤項羽王乎沛公默然良久曰固不能也今為奈何良乃因固要項伯項伯見沛公沛公與伯飲為夀結賔婚令項伯具言沛公不敢倍背項羽王所以距關者備他它盜也及見項羽後解語在項羽事中傳漢元年正月沛公為漢王王巴蜀漢王賜良金百鎰溢珠二斗良具以獻項伯漢王亦因令良厚遺項伯使請漢中地項王乃許之遂得漢中地漢王之國良送至褒中遣良歸韓良因説漢王曰王何不燒絶所過棧道示天下無還心以固項王意乃乃使良還行燒絶棧道良歸至韓韓王成聞項羽以良從漢王故項王不遣韓王成之國從與俱東至彭城殺之良説項王曰漢王燒絶棧道無還心矣時漢王還定三秦良乃遺項羽書曰漢王失職欲得關中如約即止不敢東又乃以齊王田榮反書告項王遺羽曰齊與趙欲并滅楚項王羽以此故無西憂漢心而發兵北擊齊項王竟不肯遣韓王乃以為侯又殺之彭城良乃亡間行歸漢王漢王亦已還定三秦矣復以良為成信侯從東擊楚至彭城漢王兵敗而還至下邑漢王下馬踞鞍鞍而問曰吾欲捐關以東等棄之誰可與共功者良進曰九江王黥布楚梟將與項王有郤隙彭越與齊王田榮反梁地此兩人可急使而漢王之將獨韓信可屬大事當一面即欲捐之捐之此三人則楚可破也漢王乃遣隨何説九江王布而使人連彭越及魏玉豹反使韓信特將兵北擊之因舉燕代伐齊趙然卒破楚者此三人力也張良多病未嘗特將兵也常為畫䇿臣時時從漢王漢三年項羽急圍漢王于滎陽漢王恐憂恐與酈食其謀撓楚權食其酈生曰昔湯伐桀封其後于杞武王伐誅紂封其後于宋今秦失無德棄義侵道伐諸侯社稷滅六國之後使無立錐之地陛下誠能復立六國後世畢已受印此其君臣百姓必皆爭戴陛下之德莫不鄉風慕義願為臣妾德義已行陛下南鄉面稱霸伯楚必斂袵而朝漢王曰善趣刻印先生因行佩之矣食其酈生未行張良從外來謁漢王漢王方食曰子房前客有為我計撓楚權者具以酈生語計告于子房良曰于子房何如良曰誰為陛下畫此計者陛下事去矣漢王曰何哉張良對曰臣請藉借前箸以為大王籌之曰昔者湯武伐桀紂而封其後于杞者度能制桀之其死命也今陛下能制項籍之死命乎曰未能也其不可一也矣武王伐紂封其後于宋者度能得紂之頭也今陛下能得項籍之頭乎曰未能也其不可二也武王入殷表商容之閭釋式箕子之拘門封比干之墓今陛下能封聖人之墓表賢人之閭式智者之門乎曰未能也其不可三也二矣發巨橋之粟散鹿臺之錢財以賜貧窮今陛下能散府庫以賜貧窮乎曰未能也其不可四三矣殷事已以畢偃革為軒倒置載干戈覆以虎皮以示天下不復用兵今陛下能偃武行文不復用兵乎曰未能也其不可五四矣休馬華山之陽示以無所為今陛下能休馬無所用乎曰未能也其不可六五矣放息牛桃林之隂野以示天下不復輸積今陛下能放牛不復輸積乎曰未能也其不可七六矣且夫天下逰士離左其親戚棄墳墓去故舊從陛下遊者但徒欲日夜望咫尺之地今復乃立六國立韓魏燕趙齊楚之後唯無復立者天下遊士各歸事其主從其親戚反其故舊墳墓陛下誰與誰取天下乎其不可八七矣且夫楚唯毋強六國立者復撓而從之陛下焉得而臣之其不可八矣誠用客此之謀陛下事去矣漢王輟食吐哺罵曰豎儒幾敗而乃公事令趣銷印後漢四年韓信破齊而欲自立為假齊王漢王怒張良説漢王漢王使良授齊王信印語在淮隂事中信傳其秋五年冬漢王追楚至陽夏南戰不利而壁固陵諸侯期不至良説漢王漢王用其計諸侯皆至語在項籍事中髙紀漢六年正月封功臣良未嘗有戰鬬功髙帝曰運籌䇿帷帳幄中決勝千里外子房功也自擇齊三萬户良曰始臣起下邳與上會留此天以臣授陛下陛下用臣計幸而時中臣願封留足矣不敢當三萬户乃乃封張良為留侯與蕭何等俱封六年上已封大功臣二十餘人其餘日夜爭功而不決未得行封上在居雒陽南宫從復道望見諸將往往數人相與坐沙中偶語上曰此何語留侯良曰陛下不知乎此謀反耳上曰天下屬安定何故而反乎留侯良曰陛下起布衣以與此屬取天下今陛下已為天子而所封皆蕭曹故人所親愛而所誅者皆平生所仇怨今軍吏計功以天下不足以遍封此屬畏陛下不能盡封恐又見疑平生過失及誅故即相聚而謀反耳上乃乃憂曰為之將奈何留侯良曰上平生所憎羣臣所共知誰最甚者上曰雍齒與我有故怨數嘗窘辱我我欲殺之為其功多故不忍留侯良曰今急先封雍齒以示羣臣羣臣見雍齒先封則人人自堅矣于是上乃置酒封雍齒為什方侯而急趣丞相御史定功行封羣臣罷酒皆喜曰雍齒尚為且侯我屬無患矣劉敬説髙帝上曰都關中上疑之左右大臣皆山東人多勸上都雒陽雒陽東有成皋西有殽黽倍背河鄉伊雒其固亦足恃留侯良曰雒陽雖有此固其中小不過數百里田地薄四面受敵此非用武之國也夫關中左殽函右隴蜀沃野千里南有巴蜀之饒北有胡苑之利阻三面而固守獨以一面東制諸侯諸侯安定河渭漕挽天下西給京師諸侯有變順流而下足以委輸此所謂金城千里天府之國也劉敬説是也于是髙帝上即日駕西都關中留侯良從入關留侯性多病疾即道引不食榖杜閉門不出嵗餘上欲廢太子立戚夫人子趙王如意大臣多諫爭未能得堅決者也吕后恐不知所為人或謂吕后曰留侯善畫計䇲上信用之吕后乃使建成侯吕澤劫留侯良曰君常為上謀臣今上日欲易太子君安得髙枕而臥乎留侯良曰始上數在困急困之中幸用臣䇲今天下安定以愛欲易太子骨肉之間雖臣等百餘人何益吕澤強要曰為我畫計留侯良曰此難以口舌爭也顧上有所不能致者天下有四人四人者年老矣皆以為上嫚侮人士故逃匿山中義不為漢臣然上髙此四人今公誠能毋愛金玉璧帛令太子為書卑辭安車因使辨士固請宜來來以為客時時從入朝令上見之則必異而問之問之上知此四人賢則一助也于是吕后令吕澤使人奉太子書卑辭厚禮迎此四人四人至客建成侯所漢十一年黥布反上病疾欲使太子將往擊之四人相謂曰凡來者將以存太子太子將兵事危矣乃乃説建成侯曰太子將兵有功則即位不益太子無功還則從此受禍矣且太子所與俱諸將皆嘗與上定天下梟將也今乃使太子將之此無異使羊將狼也皆不肯為盡力用其無功必矣臣聞母愛者子抱今戚夫人日夜侍御趙王如意常抱居前上曰終不使不肖子居愛子之上眀乎其代太子位必矣君何不急請吕后承間為上泣言黥布天下猛將也善用兵今諸將皆陛下故等夷乃乃令太子將此屬無異使羊將狼莫肯為用且使布聞之則鼓行而西耳上雖病疾強載輜車臥而護之諸將不敢不盡力上雖苦強為妻子計自強于是吕澤立夜見吕后吕后承間為上泣涕而言如四人意上曰吾惟之豎子固不足遣而乃公自行耳于是上自將兵而東羣臣居守皆送至灞霸上上留侯病良疾自強起至曲郵見上曰臣宜從病疾甚楚人剽疾願上慎無毋與楚人爭鋒因説上曰令太子為將軍監關中兵上曰謂子房雖病疾強臥而傅太子是時叔孫通已為太傅留侯良行少傅事漢十二年上從擊破布軍歸疾益甚愈欲易太子留侯良諫不聽因疾不視事叔孫太傅稱説引古今以死爭太子上詳陽許之猶欲易之及燕宴置酒太子侍四人者從太子年皆八十有餘鬚眉皓白衣冠甚偉上怪之問曰彼何為者四人前對各言其名姓名曰東園公甪里先生綺里季夏黃公上乃乃大驚曰吾求公數嵗公避逃我今公何自從吾兒遊乎四人皆曰陛下輕士善罵臣等義不受辱故恐而亡匿今竊聞太子為人仁孝恭敬愛士天下莫不延頸欲願為太子死者故臣等來耳上曰煩公幸卒調護太子四人為夀已畢趨去上目送之召戚夫人指示視四人者曰我欲易之彼四人為之輔之羽翼已成難動矣吕氏真而乃主矣戚夫人泣涕上曰為我楚舞吾為若楚歌歌曰鴻鵠髙飛一舉千里羽翮翼已就橫絶四海橫絶四海當又可奈何雖有矰繳尚安所施歌數闋戚夫人噓唏歔欷流涕上起去罷酒竟不易太子者留侯良本招此四人之力也留侯良從上擊代出竒計下馬邑下及立蕭何相國所與上從容言天下事甚衆非天下所以存亡故不著良乃留侯乃稱曰家世相韓及韓滅不愛萬金之資為韓報讎仇強秦天下振震動今以三寸舌為帝者師封萬户位列侯此布衣之極于良足矣願棄人間事欲從赤松子逰耳乃乃學辟榖道引欲輕舉身會髙帝崩吕后德良乃留侯乃強食之曰人生一世間如白駒之過隙何至自苦如此乎留侯良不得已強聽而食後八年卒六嵗薨諡為曰文成侯子不疑代侯子房良始所見下邳圯上老父與太公書者後十三年嵗從髙帝過濟北果見得榖城山下黃石取而葆寶祠之及留侯良死并葬黃石冢每上冢伏臘祠黃石留侯子不疑嗣侯孝文帝五三年坐不敬國除太史公曰學者多言無鬼神然言有物至于留侯所見老父豫書亦可怪矣髙祖離困者數矣而留侯常有功力焉豈可謂非天乎上曰夫運籌䇿帷帳之中決勝千里之外吾不如子房余以為其人計魁梧竒偉至見其圖狀貌如婦人好女蓋孔子曰以貌取人失之子羽留侯亦云班馬異同卷五
