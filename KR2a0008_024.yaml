body:
  text: 班馬異同卷二十四宋倪思編衛將軍驃騎列傳第五十一史記百一十一衛青霍去病列傳二十五漢書五十五大將軍衛青者字仲卿其父鄭季河東平陽人也其父鄭季為吏以縣吏給事平陽侯家平陽侯曹壽尚武帝姊陽信長公主季與侯妾主家僮衛媪通生青青有同母兄衛長子君及而姊衛子夫子夫自平陽公主家得幸天子武帝故青冒姓為衛氏字仲卿長子更字長君母號為衛媪媪長女衛君孺次女少兒次女即則子夫後子夫男弟步廣皆冒衛氏青為侯家人少時歸其父其父使牧羊先民母之子皆奴畜之不以為兄弟數青嘗從入人至甘泉居室有一鉗徒相青曰貴人也官至封侯青笑曰人奴之生得毋無笞罵即足矣安得封侯事乎青壯為侯家騎從平陽主建元二年春青姊子夫得入宫幸上皇后堂邑大長公主女也無子妒大長公主聞衛子夫幸有身妒之乃使人捕青青時給事建章未知名大長公主執囚青欲殺之其友騎郎公孫敖與壯士往篡取之以故得不死上聞乃召青為建章監侍中及同母昆弟貴賞賜數日間纍千金君孺為太僕公孫賀妻少兒故與陳掌通上召貴掌公孫敖由此益貴顯子夫為夫人青為太中大夫元光五六年拜青為車騎將軍擊胸奴出上谷太僕公孫賀為輕車將軍出雲中太中大夫公孫敖為騎將軍出代郡衛尉李廣為驍騎將軍出鴈門軍各萬騎青至籠城斬首虜數百騎將軍敖亡七千騎衛尉李廣為虜所得得脫歸皆當斬贖為庶人賀亦無功唯青賜爵關內侯是後胸奴仍侵犯邉語在胸奴傳元朔元年春衛夫人有男立為皇后其秋青為車騎將軍出鴈門復將三萬騎出鴈門擊胸奴斬首虜數千人明年胸奴入殺遼西太守虜略漁陽二千餘人敗韓將軍軍漢令將軍李息擊之出代郡青斬首虜數千明年令車騎將軍青復出雲中以西至髙闕遂略河南地至于隴西捕首虜數千畜數十百餘萬走白羊樓煩王遂以取河南地為朔方郡以三千八百户封青為長平侯青挍尉蘇建有功以千一百户封建為平陵侯使建築朔方城青挍尉張次公有功封為岸頭侯使建築朔方城天子上曰胸奴逆天理亂人倫暴長虐老以盜竊為務行詐諸蠻夷造謀籍兵數為邉害故興師遣將以征厥罪詩不云乎薄伐玁狁至于太原出車彭彭城彼朔方今車騎將軍青度西河至髙闕獲首虜二千三百級車輜畜産畢收為鹵已封為列侯遂西定河南地按榆溪舊塞絶梓領梁北河討蒲泥破符離斬輕鋭之卒捕伏聽者三千七一十一七級執訊獲醜毆馬牛羊百有餘萬全甲兵而還益封青三千八百户其明年後胸奴比嵗入殺代郡太守友入略鴈門千餘人其明年胸奴大入伐定襄上郡朔方所殺略漢數千人甚衆語在胸奴傳其明年元朔之五年春漢令車騎將軍青將三萬騎出髙闕衛尉蘇建為游擊將軍左內史李沮為彊弩將軍太僕公孫賀為騎將軍代相李蔡為輕車將軍皆領屬車騎將軍俱出朔方大行李息岸頭侯張次公為將軍俱出右北平咸擊胸奴胸奴右賢王當衛青等兵以為漢兵不能至此飲醉漢兵夜至圍右賢王右賢王驚夜遁逃獨與其愛妾一人壯騎數百馳潰圍北去漢輕騎挍尉郭成等逐追數百里不及弗得得右賢裨王十餘人衆男女萬五千餘人畜數千十百萬於是引兵而還至塞天子使使者持大將軍印即軍中拜車騎將軍青為大將軍諸將皆以兵屬大將軍大將軍立號而歸天子上曰大將軍青躬率戎士師大捷獲胸奴王十有餘人益封青六八千七百户而封青子伉為冝春侯青子不疑為隂安侯青子登為發干侯青固謝曰臣幸得待罪行間賴陛下神靈軍大捷皆諸挍尉力戰之功也陛下幸巳益封臣青臣青子在襁褓中未有勤勞上幸列裂地封為三侯非臣待罪行間所以勸士力戰之意也伉等三人何敢受封天子上曰我非忘諸挍尉功也今固且圖之乃詔御史曰護軍都尉公孫敖三從大將軍擊胸奴常護軍傅挍獲王以千五百户封敖為合騎侯都尉韓說從大將軍出窳置渾至胸奴右賢王庭為麾戲下搏戰獲王以千三百户封說為龍額侯騎將軍公孫賀從大將軍獲王以千二百户封賀為南窖侯輕車將軍李蔡再從大將軍獲王以千六百户封蔡為樂安侯挍尉李朔挍尉趙不虞挍尉公孫戎奴各三從大將軍獲王以千三百户封朔為涉陟軹侯以千三百户封不虞為隨成侯以千三百户封戎奴為從平侯將軍李沮李息及挍尉豆如意中郎將綰皆有功賜爵關內侯沮息如意食邑各三百户其秋胸奴入代殺都尉朱英其明年春大將軍青出定襄合騎侯敖為中將軍太僕賀為左將軍翕侯趙信為前將軍衛尉蘇建為右將軍郎中令李廣為後將軍左內史李沮為彊弩將軍咸屬大將軍斬首數千級而還月餘悉復出定襄擊胸奴斬首虜萬餘人右將軍蘇建前將軍趙信并軍三千餘騎獨逢單于兵與戰一日餘漢兵且盡前將軍信故胡人降為翕侯見急胸奴誘之遂將其餘騎可八百奔降單于右將軍蘇建盡亡其軍獨以身得亡去自歸大將軍青大將軍青問其罪正閎長史安議郎周霸等建當云何霸曰自大將軍出未嘗斬裨將今建棄軍可斬以明將軍之威閎安曰不然兵法小敵之堅大敵之禽也今建以數千當單于數萬力戰一日餘士盡皆不敢有二心自歸自歸而斬之是示後無反意也不當斬大將軍青曰青幸得以肺腑胏附待罪行間不患無威而霸說我以明威甚失臣意且使臣職雖當斬將以臣之尊寵而不敢自擅專誅於境外而具其歸天子天子自裁之於是以見風為人臣不敢專權不亦可乎軍吏皆曰善遂囚建詣行在所入塞罷兵是嵗也霍去病始侯史記是嵗也連大將軍姊子漢書衛青傳止此下别起霍去病傳大將軍姊子霍去病大將軍靑姊少兒子也其父霍仲孺先與少兒通生去病及衛皇后尊少兒更為詹事陳掌妻去病以皇后姊子年十八幸為天子侍中善騎射再從大將軍大將軍受詔與子壯士為剽票姚挍尉與輕勇騎八百直棄大將軍數百里赴利斬捕首虜過當於是天子上曰剽票姚挍尉去病斬首捕虜二千二十八級及得相國當户斬單于大父行籍若侯産生捕季父羅姑比再冠軍以二千六五百户封去病為冠軍侯上谷太守郝賢四從大將軍捕斬首虜二千餘人三百級以千一百户封賢為衆終利侯騎士孟已有功賜爵關內侯邑三百户是嵗失兩將軍軍亡翕侯軍功不多故大將軍青不益封右將軍蘇建至天子上不弗誅赦其罪贖為庶人大將軍靑既還賜千金是時王夫人方幸於上寧乘說大將軍青曰將軍所以功未甚多身食萬户三子皆為侯者徒以皇后故也今王夫人幸而宗族未富貴願將軍奉所賜千金為王夫人親壽大將軍青乃以五百金為王夫人親壽天子上聞之問大將軍青大將軍青以實言對上乃拜寧乘為東海都尉校尉張騫從大將軍以嘗使大夏留胸奴中久導道軍知善水草處軍得以無饑渴因前使絶國功封騫為博望侯冠軍侯去病既侯三嵗元狩二三年春以冠軍侯去病為驃票騎將軍將萬騎出隴西有功天子上曰驃票騎將軍率戎士踰烏盩討遫濮涉狐奴歷五王國輜重人衆攝懾讋者弗取兾幾獲單于子轉戰六日過焉支山千有餘里合短兵鏖臯蘭下殺折蘭王斬盧胡侯王鋭悍者誅全甲獲醜執渾邪王子及相國都尉捷首虜八千餘九百六十級收休屠祭天金人師率減什七益封去病二千二百户其夏驃騎將軍去病與合騎侯敖俱出北地異道博望侯張騫郎中令李廣俱出右北平異道皆擊胸奴郎中令廣將四千騎先至博望侯騫將萬騎在後至胸奴左賢王將數萬騎圍郎中令廣郎中令廣與戰二日死者過半所殺亦過當博望侯騫至胸奴兵引去博望侯騫坐行留當斬贖為庶人而驃騎將軍去病出北地已遂深入與合騎侯失道不相得驃騎將軍去病踰居延至祈連山捕首虜甚多天子上曰驃票騎將軍踰涉鈞耆濟居延遂過臻小月氏攻祈連山揚武乎鱳得得單于單桓酋涂王及相國都尉以衆降下者二千五百人可謂能舍服知成而止矣捷斬首虜三萬二百級獲五王五王母單于閼氏王子五十九人相國將軍當户都尉六十三人師大率減什三益封去病五千四百户賜挍尉從至小月氏者爵左庶長鷹擊司馬破奴再從驃票騎將軍斬遬濮王捕稽且王右千騎將得王王母各一人王子以下四十一人捕虜三千三百三十人前行捕虜千四百人以千五百户封破奴為從驃票侯挍尉句王髙不識從驃票騎將軍捕呼于屠耆王王子以下十一人捕虜千七百六十八人以千一百户封不識為冝冠侯挍尉僕多有功封為輝渠侯合騎侯敖坐行留不與驃票騎將軍㑹當斬贖為庶人諸宿將所將士馬兵亦不如驃騎去病驃騎去病所將常選然亦敢深入常與壯騎先其大將軍軍亦有天幸未嘗困絶也然而諸宿將常坐留落不遇耦由此驃騎去病日以親貴比大將軍其秋後單于怒渾邪王居西方數為漢所破亡數萬人以驃票騎之兵也單于怒欲召誅渾邪王渾邪王與休屠王等謀欲降漢使人先遣使向邉境要遮漢人令報天子要道邉是時大行李息將城河上得渾邪王使即馳傳以聞天子上聞之於是恐其以詐降而襲邉乃令驃騎將軍去病將兵往迎之驃騎去病既渡度河與渾邪王衆相望渾邪王裨王將見漢軍而多欲不降者頗遁去驃騎去病乃馳入得與渾邪王相見斬其欲亡者八千人遂獨遣渾邪王乘傳先詣行在所盡將其衆渡度河降者數萬人號稱十萬既至長安天子所以賞賜者數十巨巨萬封渾邪王萬户為漯隂侯封其裨王呼毒尼為下摩侯鷹庇䧹疪為輝渠侯禽黎為河綦侯大當户銅離調雖為常樂侯於是天子上嘉驃騎去病之功曰驃票騎將軍去病率師攻征胸奴西域王渾邪王及厥衆萌咸相奔於率以軍糧接食并將控弦萬有餘人誅獟駻悍獲捷首虜八千餘級降異國之王三十二人戰士不離傷十萬之衆咸畢懷集服仍與興之勞爰及河塞庶幾無亡患幸既永綏矣以千七百户益封驃票騎將軍減隴西北地上郡戍卒之半以寬天下之繇役居頃之乃乃分徙處降者於邉五郡故塞外而皆在河南因其故俗為屬國其明年胸奴入右北平定襄殺略漢千餘人其明年天子上與諸將議曰翕侯趙信為單于畫計常以為漢兵不能度幕輕留今大發士卒其勢藝必得所欲是嵗元狩四年也元狩四年春上令大將軍青驃票騎將軍去病將各五萬騎步兵轉者踵軍數十萬而敢力戰深入之士皆屬驃騎去病驃騎去病始為出定襄當單于捕虜虜言單于東乃乃更令驃騎去病出代郡令大將軍青出定襄郎中令李廣為前將軍太僕公孫賀為左將軍主爵趙食其為右將軍平陽侯襄為後將軍皆屬大將軍兵即度幕人馬凡五萬騎與驃騎等咸擊胸奴單于趙信為單于謀曰漢兵既即度幕人馬罷胸奴可坐收虜耳乃乃悉逺北其輜重皆以精兵待幕北而適直大將軍青軍出塞千餘里見單于兵陳而待於是大將軍青令武剛車自環為營而縱五千騎往當胸奴胸奴亦縱從可萬騎㑹日且入而大風起砂沙礫擊面兩軍不相見漢益縱左右翼繞單于單于視漢兵多而士馬尚彊戰而胸奴不利薄暮單于遂乘六裸壯騎可數百直冒漢圍西北馳去時已昏漢胸奴相紛拿殺傷大當漢軍左挍捕虜言單于未昏而去漢軍因發輕騎夜追之大將軍靑軍因隨其後胸奴兵亦散走遲㑹明行二百餘里不得單于頗捕斬首虜萬餘級遂至填顔山趙信城得胸奴積粟食軍軍留一日而還悉燒其城餘粟以歸大將軍靑之與單于㑹也而前將軍廣右將軍食其軍别從東道或失道後擊單于大將軍引還過幕南乃得乃相逢前將軍右將軍大將軍青欲使使歸報令長史簿責前將軍廣廣自殺右將軍食其至下吏贖為庶人大將軍青軍入塞凡斬捕首虜萬九千級是時胸奴衆失單于十餘日右谷蠡王聞之自立為單于單于後得其衆右王乃乃去單于之號驃騎將軍去病亦將五萬騎兵車重與大將軍軍等而無亡裨將悉以李敢等為大挍當裨將出代右北平二千餘里直左方兵所斬捕功已多於大將軍青軍既皆還天子上曰驃票騎將軍去病率師躬將所獲葷粥允之士約輕齎絶大幕涉獲單于章渠以誅北車耆轉擊左大將軍斬雙獲旗鼓歷涉離度難侯濟弓閭盧獲屯頭王韓王等三人將軍相國當户都尉八十三人封狼居胥山禪於姑衍登臨翰海執鹵訊獲醜七萬有四百四十三級師率減什三二取食於敵逴卓行殊逺而糧不絶以五千八百户益封驃票騎將軍右北平太守路博德屬驃票騎將軍㑹與興城不失期從至檮余山斬首捕虜二千七八百級以千六百户封博德為符邳離侯北地都尉邢衛山從驃票騎將軍獲王以千二百户封山為義陽侯故歸義侯因淳王復陸支樓專剸王伊即靬皆從驃票騎將軍有功以千三百户封復陸支為壯杜侯以千八百户封伊即靬為衆利侯從驃票侯破奴昌武侯安稽從驃票騎有功益封各三百户漁陽太守解挍尉敢皆獲得鼓旗鼓賜爵為關內侯解食邑三百户敢二百户挍尉自為爵大左庶長軍吏卒為官賞賜甚多而大將軍青不得益封軍吏卒皆無封侯者唯河西太守常惠雲中太守遂成受賞遂成秩諸侯相賜食邑二百户黃金百斤惠爵關內侯兩軍之出塞塞閲官及私馬凡十四萬匹而後復入塞者不滿三萬匹乃乃益置大司馬位及大將軍驃票騎將軍皆為大司馬定令令驃票騎將軍秩祿與大將軍等自是之後大將軍青日退衰而驃騎去病日益貴舉大將軍靑故人門下多去事驃騎去病輒得官爵唯獨任安不肻去驃騎將軍去病為人少言不泄有氣敢任往天子上嘗欲教之孫吳孫兵法對曰顧方略何如耳不至學古兵法天子上為治第令驃騎視之對曰胸奴未不滅無以家為也由此上益重愛之然少而侍中貴不省士其從軍天子上為遣太官齎數十乘既還重車餘棄粱肉而士有饑者其在塞外卒乏糧或不能自振而驃騎去病尚穿域踏躢鞠也事多此類大將軍青為人仁善喜士退讓以和柔自媚於上然於天下未有稱也驃騎將軍去病自四年軍後三年嵗元狩六年而卒薨天子上悼之發屬國𤣥甲軍陳自長安至茂陵為冢像象祁連山諡之并武與廣地曰景桓侯子嬗嗣代侯嬗少字子侯上愛之幸其壯而將之居六嵗元封元年嬗為奉車都尉從封泰山而薨卒諡哀侯無子絶國除自驃騎將軍去病死後大將軍青長子冝春侯伉坐法失侯後五嵗伉弟二人隂安侯不疑及發干侯登皆坐酎金失侯失侯後二嵗冠軍侯國除絶其後四年元封五年大將軍青卒薨諡為曰烈侯子伉嗣代為長平侯六年坐法免自大將軍青圍單于之後十四年嵗而卒竟不復擊胸奴者以漢馬少而又方南誅兩越東伐朝鮮擊羌西南夷以故久不伐胡初青既尊貴而平陽侯曹壽有惡疾就國長公主問列侯誰賢者左右皆言大將軍主笑曰此出吾家常騎從我奈何左右曰於今尊貴無比於是長公主風白皇后皇后言之上乃詔青大將軍以其得尚平陽公主與主合葬起冢象廬山云故長平侯伉代侯六嵗坐法失侯左右兩大將軍及諸裨將名最大將軍青凡七出擊胸奴斬捕首虜五萬餘級一與單于戰收河南地遂置朔方郡再益封凡萬一六千八三百户封三子為侯侯千三百户并之二萬五千七二百户其挍尉裨將及挍尉以從大將軍侯者九人其裨將及挍尉已為特將者十四五人為裨將者曰李廣張騫公孫賀李蔡曹襄韓說蘇建皆自有傳無傳者曰將軍公孫賀賀義渠人其先胡種賀父渾邪景帝時為平曲侯坐法失侯賀武帝為太子時舍人武帝立八嵗以太僕為輕車將軍軍馬邑後四歲以輕車將軍出雲中後五歲以騎將軍從大將軍有功封為南窖侯後一歲以左將軍再從大將軍出定襄無功後四歲以坐酎金失侯後八歲以浮沮將軍出五原二千餘里無功後八歲以太僕為丞相封葛繹侯賀七為將軍出擊胸奴無大功而再侯為丞相坐子敬聲與陽石公主姧為巫蠱族滅無後漢書别傳將軍李息郁郅人也事景帝至武帝立八歲為材官將軍軍馬邑後六歲為將軍出代後三歲為將軍從大將軍出朔方皆無功凡三為將軍其後常為大行將軍公孫敖義渠人以郎事武景帝至武帝立十二歲為驃騎將軍出代亡卒七千人當斬贖為庶人後五歲以挍尉從大將軍有功封為合騎侯後一歲以中將軍從大將軍再出定襄無功後二歲以將軍出北地後驃騎失期當斬贖為庶人後二歲以挍尉從大將軍無功後十四歲以因杅將軍築受降城七歲復以因杅將軍再出擊胸奴至余吾亡士卒多下吏當斬詐死亡居民間五六嵗後發覺復擊坐妻為巫蠱族凡四為將軍出擊胸奴一侯將軍李沮雲中人事景帝武帝立十七嵗以左內史為彊弩將軍後一嵗復為彊弩將軍將軍李蔡成紀人也事孝文帝景帝武帝以輕車將軍從大將軍有功封為樂安侯已為丞相坐法死漢書别傳將軍張次公河東人以挍尉從衛大將軍青有功封為岸頭侯其後太后崩為將軍軍北軍後一嵗為將軍復從大將軍凡再為將軍後坐法失侯次公父隆輕車武射也以善射景帝幸近之也將軍蘇建杜陵人以挍尉從衛將軍青有功為平陵侯以將軍築朔方後四嵗為游擊將軍從大將軍出朔方後一嵗以右將軍再從大將軍出定襄亡翕侯失軍當斬贖為庶人其後為代郡太守卒冢在大猶鄉漢書别傳將軍趙信以胸奴相國降為翕侯武帝立十七嵗八年為前將軍與單于胸奴戰敗降胸奴將軍張騫以使通大夏還為挍尉從大將軍有功封為博望侯後三嵗為將軍出右北平失期當斬贖為庶人其後使通烏孫為大行而卒冢在漢中漢書别傳將軍趙食其祋祤人也武帝立二十二嵗八年以主爵都尉從大將軍斬首六百六十級元狩三年賜爵關內侯黃金百斤明年為右將軍從大將軍出定襄迷失道當斬贖為庶人將軍曹襄以平陽侯為後將軍從大將軍出定襄襄曹參孫也漢書别傳將軍韓說弓髙侯庶孫也以挍尉從大將軍有功為龍額侯坐酎金失侯元鼎六年以待詔為橫海將軍擊東越有功為按道侯以太初三年為游擊將軍屯於五原外列城為光祿勳掘蠱太子宫衛太子殺之漢書别傳將軍郭昌雲中人也以挍尉從大將軍元封四年以太中太夫為拔胡將軍屯朔方還擊昆明無功奪印將軍荀彘太原廣武人以御見侍中用為挍尉數從大將軍以元封三年為左將軍擊朝鮮無功以坐捕樓船將軍坐法死誅最驃票騎將軍去病凡六出擊胸奴其四出以將軍斬捕首虜首十一萬餘級及渾邪王以衆降數萬遂開河西酒泉之地西方益少胡寇四益封凡萬五七千一七百户其挍尉吏有功為侯者凡六人而後為將軍者二人將軍路博德西河平州人以右北平太守從驃票騎將軍有功封為符邳離侯驃票騎死後博德以衛尉為伏波將軍伐破南越益封其後坐法失侯為彊弩都尉屯居延卒將軍趙破奴故九太原人嘗亡入胸奴已而歸漢為驃票騎將軍司馬出北地時有功封為從驃票侯坐酎金失侯後一嵗為胸河將軍攻胡至胸河水無功後二一嵗擊虜樓蘭王後復封為浞野侯後六嵗以為浚稽將軍將二萬騎擊胸奴左賢王左賢王與戰兵八萬騎圍破奴破奴生為虜所得遂沒其軍居胸奴中十嵗復與其太子安國亡入漢後坐巫蠱族自衛氏興大將軍青首封其後枝支屬五人為五侯凡二十四嵗而五侯盡皆奪國衛氏無為侯者征和中戾太子敗衛氏遂滅而霍去病弟光貴盛自有傳太史公贊曰蘇建語余曰吾嘗說責大將軍至尊重而天下之賢士大夫毋無稱焉願將軍觀古名將所招選擇賢者勉之哉大將軍青謝曰自魏其武安之厚賓客天子嘗切齒彼親附待士大夫招賢絀黜不肖者人主之柄也人臣奉法遵職而已何與招士驃票騎亦放方此意其為將如此班馬異同卷二十四
