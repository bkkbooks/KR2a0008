body:
  text: 班馬異同卷二十九宋倪思編汲黯列𫝊第六十史記一百二十汲黯鄭莊𫝊第二十漢書五十汲黯字長孺濮陽人也其先有寵於古之衛君也至黯七十世世為卿大夫黯以父任孝景時為太子洗馬以莊嚴見憚孝景帝崩太子武帝即位黯為謁者東越粵相攻上使黯往視之不至至吳而還報曰越粵人相攻固其俗然不足以辱天子之使者河內失火延燒千餘家上使黯往視之還報曰家人失火屋比延燒不足憂也臣過河南內河南內貧人傷水旱萬餘家或父子相食臣謹以便宜持節發河南內倉粟以振貧民臣請歸節伏矯制之罪罪上賢而釋之遷為滎陽令黯恥為令稱疾病歸田里上聞乃乃召拜為中大夫以數切諫不得久留內遷為東海太守黯學黃老之言治官理民好清靜擇丞史而任之其治責大指而已不細苛小黯多病卧閨閣內不出歲餘東海大治稱之上聞召以為主爵都尉列於九卿治務在無為而已𢎞引大體不拘文法黯為人性倨少禮面折不能容人之過合已者善待之不合已者不弗能忍見士亦以此不附焉然好學游俠任氣節內行修潔其好直諫數犯主之顔色常慕傅伯袁爰盎之為人也善灌夫鄭當時及宗正劉棄疾亦以數直諫不得久居位當是時太后弟武安侯田蚡為丞相中二千石來拜謁蚡不弗為禮然黯見蚡未嘗拜常揖之天子上方招文學儒者上曰吾欲云云黯對曰陛下內多欲而外施仁義奈何欲效唐虞之治乎呼上默然怒變色而罷朝公卿皆為黯懼上退謂左右人曰甚矣汲黯之戅也羣臣或數黯黯曰天子置公卿輔弼之臣寧令從諛承意陷主於不義乎呼且已在其位縱愛身奈辱朝廷何黯多病病且滿三月上常賜告者數終不愈愈最後病莊嚴助為請告上曰汲黯何如人哉也助曰使黯任職居官無以踰愈人然至其輔少主守城成深堅招之不來麾之不去雖自謂賁育亦不弗能奪之矣也上曰然古有社稷之臣至如汲黯近之矣大將軍青侍中上踞厠而視之丞相𢎞燕晏見上或時不冠至如見黯見上不冠不見也上嘗坐武帳中黯前奏事上不冠望見黯避帳帷中使人可其奏其見敬禮如此張湯方以更定律令為廷尉黯數質責湯於上前曰公為正卿上不能褒先帝之功業下不能抑化天下之邪心安國富民使囹圄空虛二者無一焉非苦就行放析就功何乃空取高皇帝約束紛更之為而公以此無種矣黯時與湯論議湯辨常在文深小苛黯伉厲守高不能屈忿憤發罵曰天下謂刀筆吏不可以為公卿果然必湯也今天下重足而立側反目而視矣是時漢方征胸奴招懷四夷黯務少事乘上間常言與胡和親無毋起兵上方嚮鄉儒術尊公孫𢎞及事益多吏民巧弄上分别文法湯等數奏决讞以幸而黯常毁儒面觸𢎞等徒懷詐飾智以阿人主取容而刀筆之吏專深文巧詆陷人於罪罔使不得反其真以勝自為功上愈益貴𢎞湯𢎞湯深心疾黯唯天子雖上亦不說也欲誅之以事𢎞為丞相乃乃言上曰右內史界部中多貴人宗室難治非素重臣不弗能任請徙黯為右內史為右內史數歲官事不廢大將軍青既益尊姊為皇后然黯與亢禮人或說黯曰自天子欲令羣臣下大將軍大將軍尊重益貴誠重君不可以不拜黯曰夫以大將軍有揖客反不重邪大將軍聞愈賢黯數請問以國家朝廷所疑遇黯過加於平生日淮南王謀反憚黯曰黯好直諫守節死義難惑以非至如說丞相公孫𢎞等如發蒙振落耳天子上既數征胸奴有功黯之言益不用始黯列為九卿矣而公孫𢎞張湯等為小吏已而𢎞至丞相封為侯湯至御史大夫故黯時丞相史皆與黯同列或尊用過之黯褊心不能無少望見上前言曰陛下用羣臣如積薪耳後來者居上上默然有間黯罷上曰人果不可以無學觀汲黯之言也日益甚矣居無何胸奴渾邪王率帥衆來降漢發車三萬乘縣官無亡錢從民貰馬民或匿馬馬不具上怒欲斬長安令黯曰長安令無亡罪獨斬臣黯民乃乃肯出馬且胸奴畔其主而降漢漢徐以縣次𫝊之何至令天下騷動罷弊中國而甘心以事夷狄之人乎呼上默然及後渾邪王至賈人與市者坐當死者五百餘人黯入請間見高門曰夫胸奴攻當路塞絶和親中國興舉兵誅之死傷者不可勝計而費以巨巨萬百數臣愚以為陛下得胡人皆以為奴婢以賜從軍死事者家所鹵獲因豫與之以謝天下之苦塞百姓之心今縱不能渾邪率帥數萬之衆來降虛府庫賞賜發良民侍養譬若奉驕子愚民安知市買長安中物而文吏繩以為闌出財物于如邊關乎陛下縱不能得胸奴之資贏以謝天下又以微文殺無知者五百餘人是所謂庇其葉而傷其枝者乎臣竊為陛下不弗取也上默然不弗許曰吾久不聞汲黯之言今又復妄發矣後數月黯坐小法㑹赦免官於是黯𨼆於田園居者數年㑹更立五銖錢民多盜鑄錢者楚地尤甚上以為淮陽楚地之郊也乃召拜黯拜為淮陽太守黯伏謝不受印綬詔數彊豫然後奉詔詔召見黯上殿黯為上泣曰臣自以為填溝壑不復見陛下不意陛下復收用之臣常有狗馬之心今病力不能任郡事臣願為中郎出入禁闥補過拾遺臣之願也上曰君薄淮陽邪吾今召君矣顧淮陽吏民不相得吾徒得君之重卧而治之黯既辭行過大行李息曰黯棄逐居郡不得與朝廷議也矣然御史大夫張湯智足以拒距諫詐足以飾非務巧佞之語辨數之辭非肯正為天下言專阿主意主意所不欲因而毁之主意所欲因而譽之好興事舞文法內懷詐以御主心外挾賊吏以為威重公列九卿不早言之何公與之俱受其戮矣息畏湯終不敢言黯居郡如其故治淮陽政清後張湯果敗上聞黯與息言抵息罪令黯以諸侯相秩居淮陽居淮陽十七歲而卒卒後上以黯故官其弟汲仁至九卿子汲偃至諸侯相黯姑姊子司馬安亦少與黯為太子洗馬安文深巧善宦官四至九卿以河南太守卒昆弟以安故同時至二千石者十人濮陽段宏始事蓋侯信信任宏宏官亦再至九卿然衛人仕者皆嚴憚汲黯出其下鄭當時者字莊陳人也其先鄭君嘗為事項籍將籍死已而屬漢高祖令諸故項籍臣名籍鄭君獨不奉詔詔盡拜名籍者為大夫而逐鄭君鄭君死孝文時鄭莊當時以任俠自喜脫張禹羽於厄厄聲聞梁楚之間孝景時為太子舍人每五日洗沐常置驛馬長安諸郊存諸故人請謝賔客夜以繼日至其明旦常恐不遍莊當時好黃老之言其慕長者如恐不稱自見年少官薄然其游知交友皆其大父行天下有名之士也武帝立即位莊當時稍遷為魯中尉濟南太守江都相至九卿為右內史以武安侯魏其時議貶秩為詹事遷為大司農令莊當時為太史誡大吏戒門下客至無亡貴賤無亡留門下者執賔主之禮以其貴下人莊性廉又不治其産業仰卬奉賜以給諸公然其餽遺人不過算具器食每朝候上之間說未嘗不言天下之長者其推轂士及官屬丞史誠有味其言之也常引以為賢於己未嘗名吏與官屬言若恐傷之聞人之善言進之上唯恐後山東士諸公以此翕然稱鄭莊鄭莊使視決河自請治行五日上曰吾聞鄭莊千里不齎糧請治行者何也然鄭莊當時在朝常趨和承意不敢甚引斥臧當否及晚節漢征胸奴招四夷天下費多財用益匱屈當時為大司農莊任人賔客為大農僦人入多逋負司馬安為淮陽太守發其事莊當時以此陷罪贖為庶人頃之守長史上以為老以莊為遷汝南太守數歲以官卒昆弟以當時故至二千石者六七人鄭莊當時始與汲黯始列為九卿廉內行修潔此兩人中廢家貧賔客益落及居郡卒後當時死家無亡餘資財莊兄弟子孫以莊故至二千石六七人焉先是下邽翟公為廷尉賔客亦填門及廢門外可設爵網後復為廷尉客欲往翟公大署其門曰一死一生乃知交情一貧一富乃知交態一貴一賤交情乃見太史公曰夫以汲鄭之賢有勢則賔客十倍無勢則否况衆人乎下邽翟公有言始翟公為廷尉賔客闐門及廢門外可設雀羅翟公復為廷尉賔客欲往翟公乃大署其門曰一死一生乃知交情一貧一富乃知交態一貴一賤交情乃見汲鄭亦云悲夫漢贊同張馮傳班馬異同卷二十九
