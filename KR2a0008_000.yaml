body:
  text: 班馬異同正史類提要臣等謹案班馬異同三十五卷舊本或題宋倪思撰或題劉辰翁撰楊士奇跋曰班馬異同三十五卷相傳作於須溪觀其評泊批㸃臻極精妙信非須溪不能而文獻通考載為倪思所撰豈作於倪而評泊出於須溪耶其語亦兩持不决案通考之載是書實據直齋書録解題使果出於辰翁則陳振孫時何得先為著録是固可不辨而明矣是編大㫖以班固漢書多因史記之舊而増損其文乃考其字句異同以參觀得失其例以史記本文大書凡史記無而漢書所加者則以細字書之史記有而漢書所刪者則以墨筆勒字旁或漢書移其先後者則注曰漢書上連某文下連某文或漢書移入别篇者則注曰漢書見某𫝊二書互勘長短較然於史學頗為有功昔歐陽棐編集古録跋尾以真跡與集本並存使讀者尋刪改之意以見前人之用心思撰是書葢即此意特棐所列者一人之異同思所列者兩人之異同遂為創例耳其中如戮力作勠力沈船作湛船由是作繇是無狀作亡狀鈇質作斧質數却作數卻之類特今古異文半菽作芋菽蛟龍作交龍之類特𫝊寫訛舛至于秦軍作秦卒人言作人謂三兩人作兩三人之類尤無闗文義皆非有意竄改思一一贅列似未免稍傷繁瑣然既以異同名書則隻字單詞皆不容略失之過密終勝于失之過疎也至英布陳涉諸𫝊軼而未録明許相卿作史漢方駕始補入之則誠千慮之一失矣思字正甫湖州歸安人乾道二年進士歴官寳文閣學士諡文節事跡具宋史𫝊乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:ddaa6813976dc5b2e70409863a4d97fb70afff4539cc45c81ec0f3fa17bfb93d
