body:
  text: 班馬異同卷二十六宋倪思編司馬相如列傳第五十七史記一百一十七司馬相如傳上第二十七漢書五十七司馬相如者字長卿蜀郡成都人也字長卿少時好讀書學擊劒故其親名之曰犬子相如既學慕藺相如之為人也更名相如以資訾為郎事孝景帝為武騎常侍非其好也會景帝不好辭賦是時梁孝王來朝從遊説之士齊人鄒陽淮陰枚乘吳莊嚴忌夫子之徒相如見而説之因病免客遊梁梁孝王令與諸生同舍相如得與諸生侯遊士居數嵗乃著子虛之賦會梁孝王卒薨相如歸而家貧無以自業素與臨邛令王吉相善吉曰長卿久宦遊不遂而困來過我於是相如往舍都亭臨邛令繆為恭敬日往朝相如相如初尚見之後稱病使從者謝吉吉愈益謹肅臨邛中多富人而卓王孫家僮客八百人程鄭亦數百人二人乃相謂曰令有貴客為具召之并召令令既至卓氏客以百數至日中謁請司馬長卿長卿謝病不能往臨臨邛令不敢嘗食身自往迎相如相如為不得已而強往一坐盡傾酒酣臨邛令前奏琴曰竊聞長卿好之願以自娛相如辭謝為鼓一再行是時卓王孫有女文君新寡好音故相如繆與令相重而以琴心挑之相如之臨邛時從車騎雍容間雅甚都及飲卓氏弄琴文君竊從戶窺之心悅而好之恐不得當也既罷相如乃使令侍人重賜文君侍者通殷勤文君夜亡奔相如乃與馳歸成都家居徒四壁立卓王孫大怒曰女至不材我不忍殺一錢不分一錢也人或謂王孫王孫終不聽文君久之不樂謂長卿曰長卿第俱如臨邛從昆弟假貸貣猶足以為生何至自苦如此相如與俱之臨邛盡賣其車騎買一酒舍酤酒而乃令文君當罏盧相如身自著犢鼻褌與庸保庸雜作滌器於市中卓王孫聞而耻之為杜門不出昆弟諸公更謂王孫曰有一男兩女所不足者非財也今文君既已失身於司馬長卿長卿故倦遊雖貧其人材足依也且又令客獨奈何相辱如此卓王孫不得已分豫與文君僮百人錢百萬及其嫁時衣被財物文君乃與相如歸成都買田宅為富人居久之蜀人楊得意為狗監侍上上讀子虛賦而善之曰朕獨不得與此人同時哉得意曰臣邑人司馬相如自言為此賦上驚乃召問相如相如曰有是然此乃諸侯之事未足觀也請為天子遊獵之賦賦成奏之上許令尚書給筆札相如以子虛虛言也為楚稱烏有先生者烏有此事也為齊難無亡是公者無亡是人也欲明天子之義故空虛藉此三人為辭以推天子諸侯之苑囿其卒章歸之於節儉因以風諫奏之天子天子大説其辭曰楚使子虛使於齊齊王悉發境內之士備車騎之衆與使者出田田罷子虛過詫姹烏有先生而無亡是公在存焉坐定烏有先生問曰今日田樂乎子虛曰樂獲多乎曰少然則何樂對曰僕樂齊王之欲夸僕以車騎之衆而僕對以雲夢之事也曰可得聞乎子虛曰可王駕車千乘選徒萬騎田於于海濵列卒滿澤罘罔彌山掩兔莬轔鹿射麋腳格麟騖於鹽浦割鮮染輪射中獲多矜而自功顧謂僕曰楚亦有平原廣澤遊獵之地饒樂若此者乎楚王之獵何孰與寡人僕下車對曰臣楚國之鄙人也幸得宿衛十有餘年時從出遊遊於後園覽於有無然猶未能遍覩也乂烏足以言其外澤者乎齊王曰雖然略以子之所聞見而言之僕對曰唯唯臣聞楚有七澤嘗見其一未覩其餘也臣之所見蓋特其小小者耳爾名曰雲夢雲夢者方九百里其中有山焉其山則盤紆岪鬱隆崇嵂律崒岑巖崟參差日月蔽虧交錯糾紛上干青雲罷池陂陀下屬江河其土則丹青赭堊雌黃白附錫碧金銀衆色炫耀照爛龍鱗其石則赤玉玫瑰琳瑉琨珸珉昆吾瑊玏玄厲瑌瓀石武夫其東則有蕙圃衡蘭芷若射干穹窮昌蒲江離䕷蘪蕪諸蔗柘猼巴且其南則有平原廣澤登降陀靡案衍壇曼緣以大江限以巫山其高燥則生葴䔮析苞荔薛薜莎青薠其卑溼則生藏莨兼葭東薔雕胡蓮藕􅀢觚蘆盧菴䕡奄閭軒芋于衆物居之不可勝圖其西則有湧泉清池激水推移外發芙蓉菱夫容菱華內隱巨石白沙其中則有神龜蛟鼉玳毒瑁冒鱉黿其北則有陰林巨樹楩柟豫章桂椒木蘭蘗檗離朱楊櫨梸梬栗橘柚芬芳其上則有赤猿蠷蝚鵷雛孔鸞騰遠射干其下則有白虎玄豹蟃蜒貙犴兕象野犀窮竒獌狿於是乎乃使專剸諸之倫手格此獸楚王乃駕馴駁駮之駟乘雕玉之輿靡魚須之橈旃曳明月之珠旗建干將之雄戟左烏嘷號之雕弓右夏服之徑箭陽子驂乘纎孅阿為御案節未舒即陵狡獸轔蹴卭卭蹴轔距虛軼野馬而􅗗騊駼乘遺風而射遊騏倏倐䎶胂凄倩浰靁動熛焱至星流霆電擊弓不虛發中必決眥洞胸達腋掖絶乎心繫獲若雨獸掩草􅋄蔽地於是楚王乃弭節裴回俳佪翺翔容與覽乎陰林觀壯士之暴怒與猛獸之恐懼徼􅚏受詘殫睹衆物之變態於是鄭女曼姬被阿錫揄紵縞雜纎羅垂霧縠襞積褰皺紆徐委曲鬱橈溪谷衯衯裶裶揚袘恤戌削蜚纎􅗒髾扶輿猗靡吸呷萃蔡下摩蘭蕙上拂羽蓋錯翡翠之威葳𬎼繆繞玉綏縹乎眇眇忽忽若神仙之仿佛髣佛於是乃羣相與獠於蕙圃媻珊勃窣上金隄掩翡翠射鵕鸃微矰出纎孅繳施弋白鵠連鴐鵝雙鶬下玄鶴加怠而後發遊於清池浮文鷁揚桂旌抴枻張翠帷建羽蓋罔玳瑁釣紫貝摐金鼓吹鳴籟榜人歌聲流喝水蟲駭波鴻沸涌泉起奔揚會礧石相擊硠硠􅐀􅐀若靁霆之聲聞乎數百里之外將息獠者擊靈鼓起烽燧車案行騎就隊纚乎淫淫班般乎裔裔於是楚王乃登陽雲之臺泊乎無為淡乎自持勺藥之和具而後御之不若大王終日馳騁而曾不下輿脟割輪淬焠自以為娛臣竊觀之齊殆不如於是王默然無以應僕也烏有先生曰是何言之過也足下不遠千里來况齊國王悉發境內之士而備車騎之衆以與使者出田乃欲戮力致獲以娛左右也何名為夸哉問楚地之有無者願聞大國之風烈先生之餘論也今足下不稱楚王之德厚而盛推雲夢以為高驕奢言淫樂而顯侈靡竊為足下不取也必若所言固非楚國之美也有而言之是章君之惡也無而言之是害足下之信也章君之惡而傷私義二者無一可而先生行之必且輕於齊而纍於楚矣且齊東有渚巨巨海南有琅邪觀乎成山射乎之罘浮勃澥遊孟諸邪與肅慎為鄰右以湯谷為界秋田乎青丘仿偟乎海外吞若雲夢者八九其於胸中曾不蒂芥若乃俶儻瑰偉瑋異方殊類珍怪鳥獸萬端鱗萃崒充仞其中者不可勝記禹不能名契卨不能計然在諸侯之位不敢言遊戲之樂苑囿之大先生又見客是以王辭而不能復何為無用以應哉無亡是公聽然而笑曰楚則失矣而齊亦未為得也夫使諸侯納貢者非為財幣所以述職也封疆畫界者非為守禦所以禁淫也今齊列為東藩而外私肅慎損國踰隃限越海而田其於義固未可也且二君之論不務明君臣之義而正諸侯之禮徒事爭於遊獵戲之樂苑囿之大欲以奢侈相勝荒淫相越此不可以揚名發譽而適足以貶専君自損也且夫齊楚之事又焉烏足道邪乎君未睹夫巨麗也獨不聞天子之上林乎左蒼梧右西極丹水更其南紫淵徑其北終始霸滻産出入涇渭酆鄗鎬潦潏紆餘委蛇經營乎其內蕩蕩兮乎八川分流相背而異態東西南北馳騖往來出乎椒丘之闕行乎洲淤之浦徑乎桂林之中過乎泱莽之野野汨乎渾混流順阿而下赴隘狹之口觸穹石激堆崎沸乎暴怒洶湧滂沸彭湃滭浡弗滵宓汨湢測逼側泌瀄橫流逆折轉騰潎洌澎滂濞沆瀣溉穹隆雲撓蜿灗宛灘膠戾盩踰波趨浥蒞蒞涖涖下瀨批巖衝壅擁奔揚滯沛臨坻注壑瀺灂霣墜隊湛湛沈沈隱隱砰磅訇􅐀潏潏淈淈湁潗鼎沸馳波跳沫汨潝漂疾悠遠長懷寂漻無聲肆乎永歸然後灝溔潢漾安翔徐佪翯乎滈滈東注大湖衍溢陂池於是乎蛟龍赤螭䱎𩶶螹漸離鰅鱅鰬魠禺禺鱋魶􅱈鰨揵鰭擢掉尾搌振鱗奮翼潛處于乎深巖魚鱉歡聲萬物衆夥明月珠子玓瓅的皪江靡蜀石黃碝水玉磊砢磷磷爛爛采色澔旰汗叢積乎其中鴻鵠鷫䲨鷫鵠鴇鴐鵝鸀屬鳿玉􅀈交􅪦精䴉旋目煩鶩鷛庸􅀈渠􅀈針䳄疵鵁鸕盧羣浮乎其上泛淫泛汜濫隨風淡淡與波搖蕩掩奄薄草水渚渚唼喋菁藻咀嚼菱藕於是乎崇山矗矗巃嵸崔巍嵳峩深林巨木嶄巖嵾參嵳差九嵏嶻嶭南山峩峩巖陀甗錡嶊崣崛崎振溪溪通谷蹇産溝瀆谽呀豁閜􅎧阜陵别島塢崴磈嵔瘣丘墟崫􅐑礨隱轔鬱􅕲礧登降施靡陂池貏豸沇允溶淫鬻散渙夷陸亭臯千里靡不被築掩以緑蕙被以江離糅以蘪蘼蕪雜以流留夷專布結縷攢戾莎揭車衡蘭稿本射干茈薑蘘荷葴橙持若蓀鮮枝支黃礫蔣芧青薠布濩閎澤延曼太原麗離靡廣衍應風披靡吐芳揚烈郁郁斐斐菲菲衆香發越肹蠁布寫䁆曖薆苾咇勃茀於是乎周覽泛汜觀瞋盼縝紛軋沕芴芒芒恍忽視之無端察之無崖涯日出東沼入於呼西陂其南則隆冬生長踊水躍波其獸則􅥠庸旄獏犛沈牛麈麋赤首圜題窮竒象犀其北則盛夏含凍裂地涉冰揭河其獸則麒麟角􅗧端騊駼槖駝蛩蛩驒騱駃騠驢騾騾於是乎離宫别館彌山跨谷高廊四注重坐曲閣華榱壁璫輦道纚屬步櫩周流長途中宿夷嵏築堂纍絫臺增成巖突突洞房俯俯杳眇而無見仰攀草橑而捫天奔星更於閨閫闥宛虹拖於楯軒青虯龍蚴蟉於東箱象輿婉蟬僤於西清靈圉燕於間觀館偓佺之倫暴於南榮醴泉湧於清室通川過乎於中庭槃磐石裖崖嶔巖倚傾嵯峩磼礏㠍嶫刻削崢嶸玫瑰碧琳􅀈􅀈珊瑚叢生瑉玉旁唐璸玢斒豳文鱗磷赤瑕駁犖雜臿其間垂綏鼂采琬琰和氏出焉於是乎盧橘夏孰黃甘橙楱枇杷橪柿楟亭㮈厚朴梬棗楊梅櫻桃蒲陶隱夫鬱薁棣榙􅭭答遝荔離枝支羅乎後宫列乎北園貤貤丘陵下平原揚翠葉扤紫莖發紅華秀垂朱榮煌煌扈扈照曜巨野沙棠櫟櫧華汜楓檘枰櫨留落胥餘邪仁頻并閭欃檀木蘭豫章女貞長千仞大連抱夸條直暢實葉葰茂楙攢立叢倚連卷纍欐佹崔錯癹骫坑衡閜砢垂條扶於疏落英幡纚紛溶蕭萷蔘旖旎猗柅從風瀏蒞卉吸歙蓋象金石之聲管籥之音柴池茈虒旋環還乎後宮雜遝襲纍輯被山緣谷循阪下隰視之無端究之無窮於是乎玄猿素雌蜼蠼飛鸓蠝蛭蜩蠗玃蝚猱螹獑胡豰蛫棲息乎其間長嘯哀鳴翩幡互經夭蟜枝格偃蹇杪顛於是乎隃絶梁騰殊榛捷垂條踔稀希間牢落陸離爛曼漫遠遷若此輩者數千百千處嬉娛遊往來宫宿館客舍庖厨不徙後宫不移百官備具於是乎背秋涉冬天子校獵乘鏤象六玉虯拖霓旌靡雲旗前皮軒後道遊孫叔奉轡衛公驂乘扈從橫行出乎四校之中鼓嚴簿縱獠獵者江河為阹泰山為櫓車騎靁起隱殷天動地先後陸離離散别追淫淫裔裔緣陵流澤雲布雨施生貔豹搏豺狼手熊羆足野野羊蒙鶡蘇袴褲白虎被豳班文跨野野馬陵三嵏之危下磧歷之坻徑徑陖峻赴險越壑厲水推椎蜚廉弄解豸豸格瑕蝦蛤鋋猛氏罥羂騕要􅒁射封豕箭不茍害解脰陷腦弓不虛發應聲而倒於是乎乘輿彌弭節裴回徘徊翺翔往來睨部曲之進退覽將帥之變態然後浸潭侵淫促節倏敻遠去流離輕禽蹴履狡獸轊􅗗白鹿捷狡兔菟軼赤電遺光耀追怪物出宇宙彎繁蕃弱滿白羽射遊梟櫟蜚虡遽擇肉而後發先中而命處弦矢分藝殪仆然後揚節而上浮陵驚風歷駭颷焱乘虛無亡與神俱轔藺玄鶴亂昆雞遒孔鸞促鵔鸃拂鷖鳥捎鳯皇捷鴛雛掩掩焦明道盡塗殫回車而還招消搖乎襄羊降集乎北紘率乎直指暗掩乎反鄉蹶石闕關歷封巒過鳷䧴鵲望露寒下棠梨息宜春西馳宣曲濯鷁牛首登龍臺掩細柳觀士大夫之勤略鈞獠獵者之所得獲觀徒車之所轔閵轢乘騎之所蹂若人民之所蹈􅀈藉與其窮極倦􅒵驚憚懾讋伏不被創刃而死者他他它它籍籍填坑滿谷掩掩平彌澤於是乎遊戲懈怠置酒乎昊皓天之臺張樂乎轇輵之宇宇撞千石之鐘立萬石之巨虡建翠華之旗樹靈鼉之鼓奏陶唐氏之舞聽葛天氏之歌千人倡萬人和山陵為之震動川谷為之蕩波巴榆宋蔡淮南于干遮文成顛歌族舉居遞奏金鼓迭起鏗鏘鎗鐺䶀闛鞈洞心駭耳荆吳鄭衛之聲韶濩武象之樂隂淫案衍之音鄢郢繽紛激楚結風俳優侏儒狄鞮之倡所以娛耳目而樂心意者麗靡爛漫於前靡曼美色於後若夫青琴宓虙妃之徒絶殊離俗妖冶嫺間都靚莊刻飾便嬛婥繛約柔橈嬛嬛嬽嬽嫵嫵媚姌纎嫋弱抴曳獨繭之褕袘袣眇閻易以戍恤削媥姺徶㣯便姍嫳屑與世殊服芬香芳漚鬱酷烈淑郁皓齒粲爛宜笑的皪長眉連姢微睇綿藐色授魂與豫心愈於側於是酒中樂酣天子芒然而思似若有亡曰嗟乎此泰大奢侈朕以覽聽餘間無事棄日順天道以殺伐時休息以於此恐後世靡麗遂往而不反返非所以為繼嗣創業垂統也於是乎乃解酒罷獵而命有司曰地可以墾辟悉為農郊以贍萌氓𨽻隤牆填􅢾塹使山澤之民得至焉實陂池而勿禁虛宫觀館而勿仞發倉廪以賑救貧窮民補不足恤鰥寡存孤獨出德號省刑罰改制度易服色更革正朔與天下為始於是歷吉日以齊戒襲朝衣服乘法駕建華旗鳴玉鸞遊乎六藝之囿馳騖乎仁義之塗覽觀春秋之林射貍首兼騶虞弋玄鶴建舞干戚載戴雲罕掩羣雅悲伐檀樂樂胥修容乎禮園翺翔于乎書圃述易道放怪獸登明堂坐清廟恣羣臣奏得失四海之內靡不受獲於斯之時天下大説嚮鄉風而聽隨流而化喟卉然興道而遷義刑錯而不用德隆乎於三皇功羡於五帝若此故獵乃可喜也若夫終日暴露馳騁勞神苦形罷車馬之用抏士卒之精費府庫之財而無德厚之恩務在獨樂不顧衆庶忘國家之政而貪雉兔莵之獲則仁者不由繇也從此觀之齊楚之事豈不哀哉地方不過千里而囿居九百是草木不得墾辟而民無所食也夫以諸侯之細而樂萬乘之所侈僕恐百姓之被其尤也於是二子愀然改容超若自失逡巡避席曰鄙人固陋不知忌諱乃今日見教謹聞受命矣賦奏天子以為郎無亡是公言天子上林廣大山谷水泉萬物及子虛言楚雲夢所有甚衆侈靡多過其實且非義理所尚止故刪取其要歸正道而論之班馬異同卷二十六
